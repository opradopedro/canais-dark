name: Fiscal dos roteiros

# Confere todo roteiro que entra na branch producao, escrito pelo Kiro ou pelo Claude.
# Se tiver erro, fica vermelho e o GitHub manda e-mail. A producao diaria nao usa roteiro quebrado:
# ela tambem roda o fiscal antes (ver crew/rodar_canal.py).
on:
  push:
    branches: [producao]
    paths: ["*/stories/**", "hora-muerta/scripts/engine.html", "hora-muerta/scripts/pecas/**", "motor-en/**", "hora-muerta/scripts/*.py"]
  pull_request:
    paths: ["*/stories/**", "motor-en/**", "hora-muerta/scripts/*.py"]
  workflow_dispatch:

jobs:
  fiscal:
    runs-on: ubuntu-latest
    # nao publica video: falha aqui nunca manda e-mail ao Pedro (REGRA 13/11); o erro fica no log
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python motor-en/validar_roteiros.py
      - name: Teste da mixagem (cada tema de musica)
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy soundfile
          python motor-en/teste_mix.py
