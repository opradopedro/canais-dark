name: Vigia das postagens

# Pedro, 24/11/2026: "nunca mais deixe isso acontecer". O TikTok ficou 6 dias parado e o longo do Wukong subiu
# 11 vezes repetido com todas as rotinas "verdes". Este vigia olha o que esta NO AR (YouTube, TikTok, Radar GTA)
# e FALHA quando algo parou ou repetiu: o GitHub manda e-mail e o texto vai para a Release "logs" (vigia.txt).
on:
  schedule:
    - cron: "20 3,15 * * *"   # 0h20 e 12h20 de Brasilia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia-postagens
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir o que esta no ar
        run: python3 vigia/postagens.py
      - name: Guardar o resultado na Release "logs"
        if: always()
        run: |
          [ -f /tmp/vigia.txt ] || exit 0
          gh release view logs > /dev/null 2>&1 || gh release create logs --title "Logs de erro" --notes "Ultimo erro de cada tarefa"
          gh release upload logs /tmp/vigia.txt --clobber
