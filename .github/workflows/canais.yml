name: Canais (producao diaria)

# Roda nos computadores do GitHub: o PC do Pedro pode ficar desligado e o Claude nao gasta token com render.
# Horarios em UTC. Cada canal so produz se estiver ligado em canais-ativos.txt (evita postar em dobro).
# A cota de voz do Gemini zera a meia-noite da California (07h/08h UTC); a producao vem depois e deixa o
# video AGENDADO no YouTube para a hora certa.
on:
  schedule:
    - cron: "30 8 * * *"    # Old Tales (sai ao meio-dia de NY)
    - cron: "30 9 * * *"    # Signal Lost (sai as 19h de NY)
    - cron: "35 12 * * *"   # So You Built It (Curiosidade 21h UTC, Evolucao 23h UTC)
    - cron: "40 18 * * *"   # Hora Muerta
    - cron: "15 3 * * *"    # metricas dos canais (fim do dia em NY)
    # REPESCAGEM (Pedro, 31/10: "nunca pode ficar sem video, mesmo quando o workflow falhar"): 2a tentativa de cada
    # canal no mesmo dia, antes do proximo horario de publicacao. Se a 1a deu certo, a fila esta cheia e nao faz nada;
    # se falhou (video barrado, Gemini fora, cron atrasado/pulado pelo GitHub), produz de novo com voz nova.
    - cron: "10 11 * * *"   # repescagem Old Tales
    - cron: "40 14 * * *"   # repescagem Signal Lost
    - cron: "45 16 * * *"   # repescagem So You Built It
    - cron: "50 21 * * *"   # repescagem Hora Muerta
  workflow_dispatch:
    inputs:
      tarefa:
        description: "teste (nao publica nada), old-tales, signal-lost, so-you-built-it, hora-muerta ou metricas"
        default: "teste"
        required: true
  # gatilho por envio: mudar .github/disparar.txt na branch producao roda a tarefa escrita nele (1a linha).
  # Serve para o Kiro ou o Claude dispararem um teste sem o Pedro precisar clicar.
  push:
    branches: [producao]
    paths: [".github/disparar.txt"]

concurrency:
  group: canais-producao
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_SURVIVAL: ${{ secrets.YT_REFRESH_TOKEN_SURVIVAL }}
      YT_REFRESH_TOKEN_CLASSICS: ${{ secrets.YT_REFRESH_TOKEN_CLASSICS }}
      YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
      YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      CANAIS_REPO: ${{ github.workspace }}
      CANAIS_SEM_ENV: "1"
      CANAIS_TIMEOUT: "11000"
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Qual tarefa
        id: qual
        run: |
          case "${{ github.event.schedule }}" in
            "30 8 * * *") T=old-tales ;;
            "30 9 * * *") T=signal-lost ;;
            "35 12 * * *") T=so-you-built-it ;;
            "40 18 * * *") T=hora-muerta ;;
            "15 3 * * *") T=metricas ;;
            "10 11 * * *") T=old-tales; R=1 ;;
            "40 14 * * *") T=signal-lost; R=1 ;;
            "45 16 * * *") T=so-you-built-it; R=1 ;;
            "50 21 * * *") T=hora-muerta; R=1 ;;
            *) if [ "${{ github.event_name }}" = push ]; then T=$(sed 's/^\xEF\xBB\xBF//' .github/disparar.txt | head -1 | tr -d '\r '); else T="${{ github.event.inputs.tarefa }}"; fi ;;
          esac
          echo "tarefa=$T" >> "$GITHUB_OUTPUT"
          echo "repescagem=${R:-}" >> "$GITHUB_OUTPUT"
          echo "Tarefa: $T${R:+ (repescagem)}"

      - name: Canal ligado?
        id: ligado
        run: |
          T="${{ steps.qual.outputs.tarefa }}"
          if [ "$T" = teste ] || [ "$T" = metricas ] || grep -qxF "$T" canais-ativos.txt; then
            echo "sim=1" >> "$GITHUB_OUTPUT"
          else
            echo "sim=0" >> "$GITHUB_OUTPUT"
            echo "$T esta desligado em canais-ativos.txt (outra automacao cuida dele). Nada a fazer."
          fi

      - uses: actions/setup-python@v5
        if: steps.ligado.outputs.sim == '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-canais.txt

      - name: Programas (FFmpeg e fontes)
        if: steps.ligado.outputs.sim == '1' && steps.qual.outputs.tarefa != 'metricas'
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu ttf-mscorefonts-installer > /dev/null

      - name: Pacotes Python
        if: steps.ligado.outputs.sim == '1'
        run: pip install -q -r .github/requirements-canais.txt

      - name: Chromium
        if: steps.ligado.outputs.sim == '1' && steps.qual.outputs.tarefa != 'metricas'
        run: python -m playwright install --with-deps chromium > /dev/null

      # caixa de narracoes + contador, sons, modelos do Whisper e do alinhador da legenda (torch), voz reserva e Three.js: guardados entre execucoes
      - name: Recuperar caixa de narracoes e sons
        if: steps.ligado.outputs.sim == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            narracoes
            sons
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/hora-muerta
            so-you-built-it/scripts/vendor
          key: canais-${{ github.run_id }}
          restore-keys: canais-

      - name: Aplicar pedidos do painel (Gemini gratis)
        if: steps.ligado.outputs.sim == '1' && steps.qual.outputs.tarefa != 'metricas' && steps.qual.outputs.tarefa != 'teste'
        continue-on-error: true
        run: |
          git config user.name "canais-bot"; git config user.email "canais-bot@users.noreply.github.com"
          python motor-en/aplicar_pedidos.py "${{ steps.qual.outputs.tarefa }}"

      - name: Rodar
        if: steps.ligado.outputs.sim == '1'
        run: |
          set -o pipefail
          export CANAIS_REPESCAGEM="${{ steps.qual.outputs.repescagem }}"
          python crew/rodar_canal.py "${{ steps.qual.outputs.tarefa }}" 2>&1 | tee /tmp/rodar-log.txt

      # se der erro, o log vai para a Release publica "logs" (Kiro e Claude leem sem entrar no GitHub)
      - name: Enviar o erro para a Release "logs"
        if: failure() && steps.ligado.outputs.sim == '1'
        run: |
          T="${{ steps.qual.outputs.tarefa }}"
          tail -c 60000 /tmp/rodar-log.txt > "/tmp/${T}_ERRO.txt" 2>/dev/null || echo "sem log" > "/tmp/${T}_ERRO.txt"
          gh release view logs > /dev/null 2>&1 || gh release create logs --title "Logs de erro" --notes "Ultimo erro de cada tarefa (gerado pelo GitHub Actions)"
          gh release upload logs "/tmp/${T}_ERRO.txt" --clobber

      # roteiro acabando, video barrado ou horario vazio: abre (ou comenta) UMA issue e o GitHub manda e-mail ao Pedro.
      # Vale mesmo quando a execucao passou (ex.: o substituto cobriu o horario), para ninguem ser pego de surpresa.
      - name: Avisar o Pedro (issue)
        if: always() && steps.ligado.outputs.sim == '1'
        run: |
          A=/tmp/canais-alerta.txt
          [ -s "$A" ] || { echo "nada a avisar"; exit 0; }
          T="Aviso dos canais: roteiro acabando ou video barrado"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number --jq '.[0].number // empty')
          { echo "Execucao: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; echo '```'; cat "$A"; echo '```'; } > /tmp/aviso.md
          if [ -n "$N" ]; then gh issue comment "$N" --body-file /tmp/aviso.md; else gh issue create --title "$T" --body-file /tmp/aviso.md --assignee "${{ github.repository_owner }}"; fi

      - name: Guardar caixa de narracoes e sons
        if: always() && steps.ligado.outputs.sim == '1' && steps.qual.outputs.tarefa != 'metricas'
        uses: actions/cache/save@v4
        with:
          path: |
            narracoes
            sons
            ~/.cache/huggingface
            ~/.cache/torch
            ~/.cache/hora-muerta
            so-you-built-it/scripts/vendor
          key: canais-${{ github.run_id }}

      # copia leve dos videos para o painel: fica numa Release publica (painel-hm / painel-yb)
      - name: Enviar videos para o painel
        if: always() && steps.ligado.outputs.sim == '1'
        run: |
          for c in hm yb sv cl; do
            d="painel-saida/$c"
            [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ] || continue
            gh release view "painel-$c" > /dev/null 2>&1 || gh release create "painel-$c" --title "Painel $c" --notes "Videos para o painel (gerado pelo GitHub Actions)"
            gh release upload "painel-$c" "$d"/* --clobber
          done

      - name: Salvar metricas no repositorio
        if: steps.qual.outputs.tarefa == 'metricas'
        run: |
          git config user.name "canais-bot"
          git config user.email "canais-bot@users.noreply.github.com"
          git add metricas/*.csv
          git diff --cached --quiet || git commit -m "metricas $(date -u +%F)"
          git push
