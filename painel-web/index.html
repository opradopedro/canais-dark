<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Painel dos canais</title>
<!-- versao 2026-10-29: celular primeiro -->
<link rel="manifest" href="data:application/manifest+json,{&quot;name&quot;:&quot;Painel dos canais&quot;,&quot;short_name&quot;:&quot;Painel&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230f1115&quot;,&quot;theme_color&quot;:&quot;%230f1115&quot;}">
<style>
  :root { --bg:#0f1115; --card:#181b22; --card2:#20242d; --line:#2a2f3a; --txt:#eceae5; --mut:#9aa0ab;
          --ok:#4fb477; --ag:#e0a93b; --rot:#7c9be0; --pri:#f2c66d; --safe-b: env(safe-area-inset-bottom, 0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  button { font:inherit; color:inherit; }

  /* topo: canais em chips que deslizam */
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.96); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .linha1 { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 4px; }
  h1 { font-size:18px; margin:0; }
  .ic { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; font-size:18px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 16px 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; height:38px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:14px; }
  .chip.on { background:var(--txt); color:var(--bg); border-color:var(--txt); font-weight:700; }

  main { padding:12px 16px calc(96px + var(--safe-b)); max-width:640px; margin:0 auto; }
  .resumo { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .num { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px; }
  .num b { display:block; font-size:20px; } .num span { color:var(--mut); font-size:12px; }
  .aviso { background:#2a2214; color:#f3d79b; border:1px solid #4a3a1c; padding:10px 12px; border-radius:12px; font-size:13px; margin-bottom:12px; }

  /* lista compacta: miniatura + texto, toque abre o detalhe */
  .item { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:10px; margin-bottom:10px; min-height:84px; }
  .item:active { background:var(--card2); }
  .mini { flex:none; width:54px; height:96px; border-radius:8px; background:#0a0b0e center/cover no-repeat; display:grid; place-items:center; color:var(--mut); font-size:20px; }
  .info { min-width:0; flex:1; }
  .tit { font-weight:600; font-size:15px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sub { color:var(--mut); font-size:13px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; margin-bottom:4px; }
  .roteiro { background:#26304a; color:#c6d4f5; } .agendado { background:#4a3a1c; color:#f3d79b; } .publicado { background:#1f3a2a; color:#a8e2bf; }
  .ped { color:var(--ag); font-size:12px; margin-top:3px; }
  .vazio { color:var(--mut); text-align:center; padding:28px 0; }

  /* barra de baixo: secoes (polegar alcanca) */
  nav { position:fixed; left:0; right:0; bottom:0; z-index:6; display:grid; grid-template-columns:repeat(3,1fr);
        background:rgba(15,17,21,.97); border-top:1px solid var(--line); padding:6px 8px calc(6px + var(--safe-b)); }
  nav button { height:54px; border:0; background:none; border-radius:12px; font-size:12px; color:var(--mut); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  nav button b { font-size:20px; font-weight:400; }
  nav button.on { color:var(--txt); background:var(--card); }

  /* folha de detalhe que sobe de baixo */
  .fundo { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:9; display:none; }
  .folha { position:fixed; left:0; right:0; bottom:0; z-index:10; max-height:92vh; overflow:auto; background:var(--card);
           border-radius:20px 20px 0 0; border-top:1px solid var(--line); transform:translateY(100%); transition:transform .22s ease;
           padding:8px 16px calc(16px + var(--safe-b)); max-width:640px; margin:0 auto; }
  .aberta .fundo { display:block; } .aberta .folha { transform:none; }
  .puxador { width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 12px; }
  .video { width:100%; max-height:52vh; aspect-ratio:9/16; background:#000; border-radius:14px; display:block; margin:0 auto 12px; object-fit:contain; }
  .folha h3 { margin:4px 0 6px; font-size:17px; }
  .acoes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; }
  .btn { display:flex; align-items:center; justify-content:center; gap:6px; height:50px; border-radius:14px; border:1px solid var(--line);
         background:var(--card2); text-decoration:none; color:var(--txt); font-size:15px; }
  .btn.pri { grid-column:1 / -1; background:var(--pri); color:#1b1408; border-color:var(--pri); font-weight:700; }
  .btn.larga { grid-column:1 / -1; }
  .fala { background:var(--bg); border-radius:12px; padding:12px; font-size:14px; color:#d6d3cc; }
  .fala p { margin:0 0 8px; } .fala p:last-child { margin:0; }
  .dica { color:var(--mut); font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <div class="linha1"><h1>Painel dos canais</h1><button class="ic" onclick="iniciar()" aria-label="Atualizar">↻</button></div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"><div class="vazio">carregando...</div></main>
<nav id="nav">
  <button data-s="fila" onclick="secao('fila')"><b>🎬</b>A postar</button>
  <button data-s="postados" onclick="secao('postados')"><b>📈</b>Postados</button>
  <button data-s="ideia" onclick="secao('ideia')"><b>💡</b>Ideias</button>
</nav>
<div id="det"><div class="fundo" onclick="fechar()"></div><div class="folha" id="folha"></div></div>
<script>
let DADOS = null, PEDIDOS = {}, CANAL = localStorage.getItem("canal") || "sv", SECAO = "fila";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const quando = iso => iso ? new Date(iso).toLocaleString("pt-BR", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
const k = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + " mil" : String(n || 0);
const canal = () => DADOS.canais.find(c => c.id === CANAL) || DADOS.canais[0];

function issue(tipo, c, it) {
  // cada pedido, voto ou ideia vira um "ticket" no GitHub; a producao le os abertos antes de fazer o video
  const cod = it ? it.codigo : "";
  const rot = { pedido: "Pedir mudança", gostei: "Gostei", naogostei: "Não gostei", ideia: "Ideia de vídeo" }[tipo];
  const title = it ? `[${cod}] ${rot}: ${it.titulo}` : `[${c.id.toUpperCase()}] ${rot}`;
  const pergunta = { pedido: `O que mudar no ${cod}? (texto, cena, título, voz, som...)`, naogostei: `O que não gostou no ${cod}?`,
                     gostei: `Gostei do ${cod}. O que mais gostou? (opcional)`, ideia: `Ideia para o ${c.nome} (tema, link de vídeo, print...)` }[tipo];
  const body = `${pergunta}\n\n\n\n---\ncanal: ${c.pasta}\ncodigo: ${cod || "-"}\narquivo: ${it ? it.arquivo : "-"}`;
  return `https://github.com/${DADOS.repo}/issues/new?` + new URLSearchParams({ title, body, labels: ["painel", tipo, c.id].join(",") });
}

function linha(it, i) {
  const estado = { roteiro: "roteiro", agendado: "sai " + quando(it.publica_em), publicado: "publicado" }[it.estado];
  const sub = it.estado === "publicado" ? `👁 ${k(it.views)} · 👍 ${k(it.likes)} · 💬 ${k(it.comentarios)}`
            : (it.partes > 1 ? `${it.serie} · parte ${it.parte}/${it.partes}` : (it.formato || it.codigo));
  const ped = (PEDIDOS[it.codigo] || []).length ? `<div class="ped">● ${PEDIDOS[it.codigo].length} pedido(s) aberto(s)</div>` : "";
  const mini = it.capa ? `style="background-image:url('${esc(it.capa)}')"` : "";
  return `<button class="item" onclick="abrir(${i})"><div class="mini" ${mini}>${it.capa ? "" : (it.estado === "roteiro" ? "📝" : "🎬")}</div>
    <div class="info"><span class="tag ${it.estado}">${esc(estado)}</span><div class="tit">${esc(it.titulo)}</div>
    <div class="sub">${esc(it.codigo)} · ${esc(sub)}</div>${ped}</div></button>`;
}

let LISTA = [];
function render() {
  const c = canal();
  document.getElementById("chips").innerHTML = DADOS.canais.map(x =>
    `<button class="chip ${x.id === c.id ? "on" : ""}" onclick="CANAL='${x.id}';localStorage.setItem('canal','${x.id}');render()">${esc(x.nome)}</button>`).join("");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.s === SECAO));
  const fila = c.itens.filter(i => i.estado !== "publicado").sort((a, b) => (a.publica_em || "9") < (b.publica_em || "9") ? -1 : 1);
  const pub = c.itens.filter(i => i.estado === "publicado").reverse();
  const prox = fila.find(i => i.estado === "agendado");
  const total = pub.reduce((s, i) => s + (i.views || 0), 0);
  const resumo = `<div class="resumo">
      <div class="num"><b>${fila.length}</b><span>na fila</span></div>
      <div class="num"><b>${prox ? quando(prox.publica_em).split(",")[0] : "—"}</b><span>próximo post</span></div>
      <div class="num"><b>${k(total)}</b><span>views</span></div></div>`;
  const aviso = c.aviso_youtube ? `<div class="aviso">${esc(c.aviso_youtube)}</div>` : "";
  let corpo;
  if (SECAO === "ideia") {
    LISTA = [];
    corpo = `<div class="fala"><p><b>Mande uma ideia para o ${esc(c.nome)}</b></p><p>Um tema, um link de vídeo que bombou ou um print. Ela vira um ticket que a próxima escrita de roteiros lê.</p></div>
      <div class="acoes"><a class="btn pri" href="${issue("ideia", c, null)}" target="_blank">💡 Escrever ideia</a>
      <a class="btn larga" href="https://github.com/${DADOS.repo}/issues?q=is%3Aopen+label%3A${c.id}" target="_blank">Ver pedidos e ideias abertos</a></div>`;
  } else {
    LISTA = SECAO === "fila" ? fila : pub;
    corpo = LISTA.length ? LISTA.map(linha).join("") : `<div class="vazio">${SECAO === "fila" ? "Nenhum roteiro na fila." : "Nada publicado ainda."}</div>`;
  }
  document.getElementById("main").innerHTML = aviso + resumo + corpo;
}

function abrir(i) {
  const c = canal(), it = LISTA[i];
  const video = it.video ? `<video class="video" src="${esc(it.video)}" ${it.capa ? `poster="${esc(it.capa)}"` : ""} controls playsinline preload="metadata"></video>` : "";
  const quandoTxt = { roteiro: "Ainda é roteiro: o vídeo é feito no dia de postar.", agendado: "Agendado para " + quando(it.publica_em), publicado: "Publicado" }[it.estado];
  const peds = (PEDIDOS[it.codigo] || []).map(p => `<a class="btn larga" href="${p.url}" target="_blank">● ${esc(p.titulo)}</a>`).join("");
  document.getElementById("folha").innerHTML = `<div class="puxador"></div>${video}
    <span class="tag ${it.estado}">${esc(it.codigo)}</span><h3>${esc(it.titulo)}</h3><div class="dica" style="margin-top:0">${esc(quandoTxt)}</div>
    <div class="acoes">
      ${it.estado !== "publicado" ? `<a class="btn pri" href="${issue("pedido", c, it)}" target="_blank">✏️ Pedir mudança</a>` : ""}
      <a class="btn" href="${issue("gostei", c, it)}" target="_blank">👍 Gostei</a>
      <a class="btn" href="${issue("naogostei", c, it)}" target="_blank">👎 Não gostei</a>
      ${it.youtube ? `<a class="btn larga" href="${esc(it.youtube)}" target="_blank">▶ Abrir no YouTube</a>` : ""}
      ${peds}
    </div>
    <div class="fala">${it.roteiro.map(l => `<p>${esc(l).replace(/\{(when_next|next_card|next_day|next_date|dia_siguiente|fecha_siguiente)\}/g, "<i>[dia da próxima parte]</i>")}</p>`).join("")}</div>
    <div class="dica">Pedidos em vídeo que ainda não saiu são aplicados antes de ele subir.</div>`;
  document.getElementById("det").classList.add("aberta");
  history.pushState({ det: 1 }, "");
}
function fechar() { document.getElementById("det").classList.remove("aberta"); }
window.onpopstate = fechar;  // botao voltar do celular fecha o detalhe
function secao(s) { SECAO = s; render(); scrollTo(0, 0); }

async function iniciar() {
  DADOS = await (await fetch("dados.json?" + Date.now())).json();
  PEDIDOS = {};
  try {
    const r = await fetch(`https://api.github.com/repos/${DADOS.repo}/issues?state=open&labels=painel&per_page=100`);
    for (const i of await r.json()) {
      const m = /^\[([A-Z]+\d+)\]/.exec(i.title || "");
      if (m) (PEDIDOS[m[1]] = PEDIDOS[m[1]] || []).push({ titulo: i.title.replace(/^\[[^\]]+\]\s*/, ""), url: i.html_url });
    }
  } catch (e) {}
  render();
}
iniciar();
</script>
</body>
</html>
