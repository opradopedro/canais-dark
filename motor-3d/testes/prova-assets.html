<!doctype html><html><body style="margin:0;background:#000"><canvas id="c" width="540" height="960"></canvas>
<script type="importmap">{"imports":{"three":"../vendor/three/build/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SU from 'three/addons/utils/SkeletonUtils.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const L=new GLTFLoader(), load=u=>new Promise((r,j)=>L.load(u,r,null,j));
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;
const S=new THREE.Scene();S.background=new THREE.Color(0x0b1430);S.fog=new THREE.Fog(0x0b1430,18,60);
const cam=new THREE.PerspectiveCamera(45,540/960,0.1,200);
S.add(new THREE.HemisphereLight(0x5570b0,0x1a2a18,0.9));
const moon=new THREE.DirectionalLight(0x9db4ff,0.8);moon.position.set(-10,20,8);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);Object.assign(moon.shadow.camera,{left:-20,right:20,top:20,bottom:-20});S.add(moon);
// stars
const sg=new THREE.BufferGeometry();const sp=[];for(let i=0;i<600;i++){const a=Math.random()*6.28,e=Math.random()*1.2+0.1,r=90;sp.push(r*Math.cos(a)*Math.cos(e),r*Math.sin(e),r*Math.sin(a)*Math.cos(e));}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.25,fog:false})));
const g=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x2f6a2a}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
const line=new THREE.Mesh(new THREE.PlaneGeometry(0.35,60),new THREE.MeshStandardMaterial({color:0xeeeeee}));line.rotation.x=-Math.PI/2;line.rotation.z=0.35;line.position.y=0.01;S.add(line);
function sh(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});return o;}
async function put(u,x,z,s=1,ry=0){const o=sh((await load(u)).scene);o.position.set(x,0,z);o.scale.setScalar(s);o.rotation.y=ry;S.add(o);return o;}
const P=['PineTree_1','PineTree_2','PineTree_3','PineTree_4','PineTree_5'];
for(let i=0;i<70;i++){const a=i*2.39,r=14+(i%7)*2.2;await put(`../assets/natureza/${P[i%5]}.glb`,Math.cos(a)*r-4,-Math.abs(Math.sin(a)*r)-6,1.1+(i%3)*0.25,i);}
const h=await put('../assets/casas/House1.glb',7,2,1,-0.6);
const sl=await put('../assets/rua/Streetlight_Single.glb',2.5,0.5,1,1.6);
const pl=new THREE.SpotLight(0xffc477,60,18,0.7,0.5,1.5);pl.position.set(2.5,5,0.5);pl.target.position.set(2,0,1);pl.castShadow=true;S.add(pl,pl.target);
await put('../assets/natureza/Bush_1.glb',-2,-3,1);
// characters
const man=await load('../assets/personagens/Mannequin_Medium.glb');
const anims={};for(const f of ['General','MovementBasic']){(await load(`../assets/animacoes/Rig_Medium_${f}.glb`)).animations.forEach(a=>anims[a.name]=a);}
function face(expr){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#111';
 if(expr==='medo'){x.beginPath();x.ellipse(85,120,16,26,0,0,7);x.ellipse(171,120,16,26,0,0,7);x.fill();x.lineWidth=10;x.strokeStyle='#111';x.lineCap='round';
 x.beginPath();x.moveTo(60,80);x.lineTo(105,68);x.moveTo(196,80);x.lineTo(151,68);x.stroke();x.beginPath();x.arc(128,205,26,Math.PI*1.15,Math.PI*1.85);x.stroke();}
 return new THREE.CanvasTexture(c);}
function boneco(cor,expr){const o=SU.clone(man.scene);sh(o);o.traverse(m=>{if(m.isMesh){m.material=new THREE.MeshStandardMaterial({color:m.name.includes('Body')?cor:0xe8e8ec,roughness:0.7});}});
 let head;o.traverse(b=>{if(b.isBone&&b.name==='head')head=b;});
 if(expr){const f=new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.62),new THREE.MeshBasicMaterial({map:face(expr),transparent:true}));f.position.set(0,0.5,0.52);head.add(f);}
 const mx=new THREE.AnimationMixer(o);return {o,mx};}
const kid=boneco(0xdddddd,'medo');kid.o.position.set(1.2,0,2);kid.o.rotation.y=-0.4;S.add(kid.o);
kid.mx.clipAction(anims['Idle_A']).play();kid.mx.update(0.8);
// creature: stretched dark mannequin
const cr=boneco(0x111111,null);cr.o.traverse(m=>{if(m.isMesh)m.material=new THREE.MeshStandardMaterial({color:0x1a1410,roughness:1});});
cr.o.scale.set(1.0,3.6,1.0);cr.o.position.set(-3.5,0,-9);cr.o.rotation.y=0.5;S.add(cr.o);cr.mx.clipAction(anims['Walking_A']).play();cr.mx.update(0.4);
let ch;cr.o.traverse(b=>{if(b.isBone&&b.name==='head')ch=b;});
for(const dx of [-0.17,0.17]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,8),new THREE.MeshBasicMaterial({color:new THREE.Color(4,3.4,1)}));e.position.set(dx,0.5,0.5);ch.add(e);}
const comp=new EffectComposer(R);comp.addPass(new RenderPass(S,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(540,960),0.9,0.5,0.85));comp.addPass(new OutputPass());
window.shot=(n)=>{if(n===0){cam.position.set(2.6,1.6,6.2);cam.lookAt(0.2,1.5,-3);}else if(n===1){cam.position.set(1.6,1.75,3.6);cam.lookAt(1.1,1.75,1.6);}else{cam.position.set(-1,0.4,-1);cam.lookAt(-3.5,5.5,-9);}comp.render();return cv.toDataURL('image/jpeg',0.9);};
window.pronto=true;
</script></body></html>
