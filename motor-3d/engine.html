<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #c { display: block; }
  /* a legenda e desenhada num canvas 2D POR CIMA do 3D (mesma resolucao) */
  #leg { position: absolute; left: 0; top: 0; pointer-events: none; }
  @font-face { font-family: 'Fredoka'; src: url('fontes/Fredoka.ttf'); font-weight: 300 700; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<canvas id="leg" width="1080" height="1920"></canvas>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { pessoa } from './kit/personagem.js';
import { criatura } from './kit/criatura.js';
import { aplicar as aplicarLuz } from './kit/luz.js';
import { montar as montarCenario } from './kit/cenarios/index.js';
import { aplicarPlano, planoAutomatico } from './kit/camera.js';
import { preCarregar } from './kit/modelos.js';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
const legCv = document.getElementById('leg');
const lx = legCv.getContext('2d');

const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setSize(W, H, false);
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.toneMappingExposure = 1.1;

let ST = null;          // estado vindo de setup(h)
let scene, cam, comp;   // cena, camera, composer
let luzCtrl = null;     // controlador de luz/efeitos por cena (troca quando o preset muda)
let atores = {};        // id -> ator (pessoa)
let criaturaAtiva = null;
let cenarioAtual = null, cenarioNome = null, luzNome = null, efeitoNome = null;
let montado = false;
let rim = null;         // rim light azulada que segue o alvo
let obstaculos = [];    // meshes/grupos grandes (arvores, casas) p/ o raycast da camera
let principais = [];    // objetos que podem ser o ASSUNTO do plano (casa, torre, poste, mausoleu...)
const ehNoite = p => /noite|madrugada|fogueira|neblina|lua|tempestade/.test(p || '');
let _silhueta = false;  // modo fiscal: pinta o alvo de magenta e o resto de preto (mede % na tela)
let _alvoAtual = null;

window.pronto = false;  // o render.py espera isto virar true (todos os .glb carregados)

// ------- helpers -------
function limparGrupo(g) { if (g && g.parent) g.parent.remove(g); }

// resolve a posicao de uma marca do cenario para {x,y,z}
function posMarca(marcas, nome) {
  const m = (marcas && marcas[nome]) || { x: 0, z: 0 };
  return { x: m.x || 0, y: 0, z: m.z || 0, cam: m.cam };
}

// ------- setup: monta a cena inteira uma vez, deixa tudo pronto para render(t) -------
window.setup = async function (h) {
  ST = h;
  ST._cenas = h.cenas || [];       // [{t0, cena:{...}}] ja com tempos
  ST._elenco = h.elenco || {};     // id -> spec de pessoa
  ST.destaqueRX = montarDestaque(h.destaque);

  scene = new THREE.Scene();
  cam = new THREE.PerspectiveCamera(42, W / H, 0.1, 300);
  cam.position.set(0, 2, 8); cam.lookAt(0, 1.4, 0);

  comp = new EffectComposer(R);
  comp.setSize(W, H);
  comp.addPass(new RenderPass(scene, cam));
  // bloom em meia resolucao (W/2 x H/2): o brilho e suave, nao precisa de resolucao cheia, e corta ~1/3 do tempo
  const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.8, 0.5, 0.82);
  comp.addPass(bloom);
  comp.addPass(new OutputPass());

  // rim light azulada: destaca o ator/criatura do fundo (sempre, principalmente a noite). Reposicionada por quadro.
  rim = new THREE.DirectionalLight(0xbcd2ff, 0.0);
  rim.castShadow = false;
  scene.add(rim, rim.target);

  // pre-carrega os .glb que o roteiro vai usar (cenarios, atores, objetos, criatura)
  await precarregarTudo();

  // cria os atores do elenco (uma vez; reaparecem iguais em todas as cenas)
  for (const [id, spec] of Object.entries(ST._elenco)) {
    atores[id] = await pessoa(spec);
    atores[id].obj.visible = false;
    scene.add(atores[id].obj);
  }

  // monta a PRIMEIRA cena agora (as trocas de cenario/luz acontecem em render quando a cena muda)
  await trocarPara(0);
  montado = true;
  window.pronto = true;
};

function montarDestaque(lista) {
  const ws = (lista || []).flatMap(d => String(d).split(/\s+/)).filter(w => w.length > 1)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return ws.length ? new RegExp('^(' + ws.join('|') + ')$', 'iu') : null;
}

// lista de arquivos a pre-carregar: cenarios usados + manequim + animais + objetos. Simplificado:
// o cenario carrega seus proprios .glb sob demanda, mas o engine espera o window.pronto so depois de montar
// a cena 0 inteira. Para os cenarios/atores seguintes, pre-carregamos o manequim e animais aqui.
async function precarregarTudo() {
  const base = ['personagens/Mannequin_Medium',
    'animacoes/Rig_Medium_General', 'animacoes/Rig_Medium_MovementBasic',
    'animacoes/Rig_Medium_MovementAdvanced', 'animacoes/Rig_Medium_Special', 'animacoes/Rig_Medium_Simulation'];
  // animais citados no elenco/cenas
  const animais = new Set();
  for (const c of ST._cenas) {
    const cena = c.cena || {};
    if (cena.criatura && cena.criatura.tipo === 'animal') animais.add('animais/' + (cena.criatura.modelo || 'Wolf'));
  }
  try { await preCarregar([...base, ...animais]); } catch (e) { /* o cenario carrega o resto */ }
}

// troca para a cena i: monta cenario/luz se mudaram, posiciona atores, ativa criatura.
async function trocarPara(i) {
  const cena = (ST._cenas[i] && ST._cenas[i].cena) || {};
  // --- cenario ---
  if (cena.cenario && cena.cenario !== cenarioNome) {
    limparGrupo(cenarioAtual && cenarioAtual.grupo);
    cenarioAtual = await montarCenario(cena.cenario, scene, {});
    cenarioNome = cena.cenario;
    // obstaculos p/ o raycast da camera: filhos de topo do grupo do cenario (arvores, casas, torre...),
    // obstaculos = so o que pode TAPAR a cabeca (arvores, casas, torre). Exclui o chao e pecas baixas e planas
    // (calcada, asfalto, caminho, praca, trilho): elas ficam no piso e nunca bloqueiam nem contam como "tronco".
    obstaculos = [];
    if (cenarioAtual.grupo) {
      const cx = new THREE.Box3();
      for (const ch of cenarioAtual.grupo.children) {
        if (ch === cenarioAtual.piso || ch.userData.chao || ch.userData.parede || ch.isLight) continue;
        if (ch.geometry && ch.geometry.type === 'PlaneGeometry') continue;
        cx.setFromObject(ch);
        if (cx.isEmpty()) continue;
        const altY = cx.max.y - cx.min.y, base = cx.min.y;
        // peça baixa (altura < 0.6 m) e colada no chao (base < 0.4 m): é piso/rua, nao obstaculo
        if (altY < 0.6 && base < 0.4) continue;
        obstaculos.push(ch);
      }
    }
    principais = (cenarioAtual.principais || []).slice();
    luzNome = null; // forca reaplicar a luz (e ajustarLuz) no cenario novo
  }
  // --- luz / efeito ---
  const preset = cena.luz || 'noite';
  const efeito = cena.efeito || null;
  if (preset !== luzNome || efeito !== efeitoNome) {
    // remove luzes antigas
    if (luzCtrl) for (const l of luzCtrl.luzes) limparGrupo(l);
    // remove estrelas/chuva/ceu antigos (por nome, caso tenham ficado)
    for (const nm of ['estrelas', 'chuva', 'ceu_domo', 'lua', 'neve']) { let o; while ((o = scene.getObjectByName(nm))) scene.remove(o); }
    const fx = efeito === 'chuva' ? 'chuva' : preset;
    const opts = {};
    if (cenarioAtual && cenarioAtual.fogoX !== undefined) { opts.fogoX = cenarioAtual.fogoX; opts.fogoZ = cenarioAtual.fogoZ; }
    luzCtrl = aplicarLuz(scene, fx, opts);
    luzNome = preset; efeitoNome = efeito;
    if (cenarioAtual && cenarioAtual.ajustarLuz) cenarioAtual.ajustarLuz(ehNoite(preset));
  }
  // --- atores desta cena ---
  for (const id of Object.keys(atores)) atores[id].obj.visible = false;
  for (const a of (cena.atores || [])) {
    const ator = atores[a.id];
    if (!ator) continue;
    ator.obj.visible = true;
    const pos = posMarca(cenarioAtual.marcas, a.para || a.marca || a.de);
    ator.obj.position.x = pos.x; ator.obj.position.z = pos.z;
    // rotacao base do ator nesta cena (a frente dele). O virarParaCamera parte daqui.
    ator.obj.rotation.y = a.girar ?? Math.PI;
    ator._ryBase = ator.obj.rotation.y;
    ator._marca = a.para || a.marca || a.de;
    ator._principal = true; // marcado como candidato a alvo
    if (a.acao) ator.acao(a.acao);
    if (a.rosto) ator.rosto(a.rosto);
    if (a.segura && ator._seg !== a.segura) { ator.segurar(a.segura); ator._seg = a.segura; }
  }
  // guarda a ordem dos atores desta cena (o 1o e o alvo preferido da camera)
  ST._atoresCena = (cena.atores || []).map(a => a.id).filter(id => atores[id]);
  // --- criatura ---
  limparGrupo(criaturaAtiva && criaturaAtiva.obj);
  criaturaAtiva = null;
  if (cena.criatura) {
    criaturaAtiva = await criatura(cena.criatura.tipo || 'alta', cena.criatura);
    const pos = posMarca(cenarioAtual.marcas, cena.criatura.marca || 'arvores');
    criaturaAtiva.obj.position.set(pos.x, 0, pos.z);
    criaturaAtiva.obj.rotation.y = cena.criatura.girar ?? Math.PI;
    scene.add(criaturaAtiva.obj);
  }
  ST._iAtual = i;
}

// qual cena no instante t
function cenaEm(t) {
  let i = 0;
  for (let k = 0; k < ST._cenas.length; k++) if (t >= ST._cenas[k].t0) i = k;
  return i;
}

// --- alvo da camera: ator principal da cena, ou criatura, ou (ultimo caso) a marca ---
const _tmpVec = new THREE.Vector3();
let _fantasma = null;
function alvoDaCena(cena, plano) {
  const ids = ST._atoresCena || [];
  // nos planos de revelacao (baixo/aberto) com criatura, o alvo e a criatura
  const criaturaReveladora = criaturaAtiva && (plano === 'baixo' || plano === 'aberto' || !ids.length);
  if (criaturaReveladora && cena.criatura) {
    return { obj: criaturaAtiva.obj, head: criaturaAtiva.head, altura: criaturaAtiva.altura || 2.4,
             raio: criaturaAtiva.raio || 0.4, ehAtor: false };
  }
  if (ids.length) {
    const a = atores[ids[0]];
    return { obj: a.obj, head: a.head, rosto: a._rosto, altura: a.altura || 1.7, raio: a.raio || 0.34,
             ehAtor: true, _ator: a, _ryBase: a._ryBase };
  }
  if (criaturaAtiva) {
    return { obj: criaturaAtiva.obj, head: criaturaAtiva.head, altura: criaturaAtiva.altura || 2.4,
             raio: criaturaAtiva.raio || 0.4, ehAtor: false };
  }
  // sem ator nem criatura: o ASSUNTO e o objeto principal mais perto da marca (casa, torre, poste, mausoleu...)
  const m = posMarca(cenarioAtual.marcas, cena.marca || 'rua');
  const pr = principalPerto(m.x, m.z, 40);
  if (pr) {
    _boxTmp.setFromObject(pr);
    return { obj: pr, head: null, altura: _boxTmp.max.y - _boxTmp.min.y, raio: 0.5, ehAtor: false, ehObjeto: true,
             caixa: _boxTmp.clone(), marca: m };
  }
  if (!_fantasma) { _fantasma = new THREE.Object3D(); scene.add(_fantasma); }
  _fantasma.position.set(m.x, 0, m.z);
  return { obj: _fantasma, head: null, altura: 1.7, raio: 0.3, ehAtor: false };
}

// objeto principal visivel mais perto de (x,z), ate `max` metros (centro da caixa no chao)
const _bxP = new THREE.Box3(), _cP = new THREE.Vector3();
function principalPerto(x, z, max = 30, exceto = null) {
  let melhor = null, dm = max;
  for (const o of principais) {
    if (o === exceto) continue;
    _bxP.setFromObject(o); if (_bxP.isEmpty()) continue; _bxP.getCenter(_cP);
    const altura = _bxP.max.y - _bxP.min.y; if (altura < 1.2) continue;
    const d = Math.hypot(_cP.x - x, _cP.z - z);
    if (d < dm) { dm = d; melhor = o; }
  }
  return melhor;
}

// vira o ator (no maximo maxGraus) para ficar de frente para a camera, mantendo a frente base como referencia.
function virarParaCamera(alvo, maxGraus) {
  const a = alvo._ator; if (!a) return;
  a.obj.getWorldPosition(_tmpVec);
  const dx = cam.position.x - _tmpVec.x, dz = cam.position.z - _tmpVec.z;
  const paraCamera = Math.atan2(dx, dz);         // angulo que aponta a frente (+Z) para a camera
  const baseY = alvo._ryBase ?? a.obj.rotation.y;
  // limita o desvio a maxGraus em relacao a frente base
  let d = paraCamera - baseY;
  while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const lim = THREE.MathUtils.degToRad(maxGraus);
  d = Math.max(-lim, Math.min(lim, d));
  a.obj.rotation.y = baseY + d;
}

// fracao da tela (0..1) coberta pela caixa de um objeto, projetando os 8 cantos na camera.
const _cantoV = new THREE.Vector3(); const _boxTmp = new THREE.Box3();
function coberturaTela(obj) {
  _boxTmp.setFromObject(obj);
  if (_boxTmp.isEmpty()) return 0;
  const mn = _boxTmp.min, mx = _boxTmp.max;
  let minx = 2, miny = 2, maxx = -2, maxy = -2, algumFrente = false;
  for (let i = 0; i < 8; i++) {
    _cantoV.set(i & 1 ? mx.x : mn.x, i & 2 ? mx.y : mn.y, i & 4 ? mx.z : mn.z);
    _cantoV.project(cam);
    if (_cantoV.z < 1) algumFrente = true;
    minx = Math.min(minx, _cantoV.x); maxx = Math.max(maxx, _cantoV.x);
    miny = Math.min(miny, _cantoV.y); maxy = Math.max(maxy, _cantoV.y);
  }
  if (!algumFrente) return 0;
  const w = Math.min(1, maxx) - Math.max(-1, minx); // NDC -1..1
  const h = Math.min(1, maxy) - Math.max(-1, miny);
  if (w <= 0 || h <= 0) return 0;
  return (w / 2) * (h / 2); // fracao da tela
}
// obstaculo cuja caixa esta a menos de `dist` da camera na horizontal (perto demais => domina o quadro)
function pertoDaCamera(obj, dist) {
  _boxTmp.setFromObject(obj);
  if (_boxTmp.isEmpty()) return false;
  const cx = (_boxTmp.min.x + _boxTmp.max.x) / 2, cz = (_boxTmp.min.z + _boxTmp.max.z) / 2;
  const dx = cx - cam.position.x, dz = cz - cam.position.z;
  const d = Math.hypot(dx, dz) - Math.max(_boxTmp.max.x - cx, _boxTmp.max.z - cz) * 0.5;
  // so conta se estiver na FRENTE da camera (produto escalar com a direcao da camera)
  const fwd = new THREE.Vector3(); cam.getWorldDirection(fwd);
  const naFrente = (dx * fwd.x + dz * fwd.z) > 0;
  return naFrente && d < dist;
}

// posiciona a rim light atras do alvo em relacao a camera (contraluz): recorta a silhueta do fundo.
function posicionarRim(alvo) {
  alvo.obj.getWorldPosition(_tmpVec);
  const cabY = _tmpVec.y + (alvo.altura || 1.7) * 0.7;
  // atras do alvo = do lado oposto a camera
  const dx = _tmpVec.x - cam.position.x, dz = _tmpVec.z - cam.position.z;
  const n = Math.hypot(dx, dz) || 1;
  rim.position.set(_tmpVec.x + (dx / n) * 4, cabY + 3, _tmpVec.z + (dz / n) * 4);
  rim.target.position.set(_tmpVec.x, cabY, _tmpVec.z);
  rim.target.updateMatrixWorld();
  // forte a noite, suave de dia
  rim.intensity = ehNoite(luzNome) ? 1.5 : 0.5;
  if (alvo.ehObjeto) rim.intensity = 0;
}

// ------- render(t): desenha o quadro do segundo t, DETERMINISTICO -------
// Importante: render.py chama render(t) em ordem crescente de t. A troca de cena (montarCenario/luz) e async;
// como render e sincrono, as trocas ja aconteceram em setup/trocarPara. Para cenas seguintes, a troca e feita
// ANTES do primeiro quadro delas por meio de prepararAte(t) chamado pelo render.py? Nao: mantemos tudo montado
// sob demanda de forma sincrona guardando promessas. Para simplicidade e determinismo, pre-montamos cada cena
// na primeira vez que t a alcanca, via fila resolvida fora do caminho do quadro (ver garantirCena).
window.render = function (t) {
  if (!montado) return;
  const i = cenaEm(t);
  if (i !== ST._iAtual) garantirCena(i); // dispara troca (async); o quadro atual pode usar a cena anterior por 1 frame

  const cena = (ST._cenas[i] && ST._cenas[i].cena) || {};
  const t0 = ST._cenas[i] ? ST._cenas[i].t0 : 0;
  const t1 = (i + 1 < ST._cenas.length) ? ST._cenas[i + 1].t0 : ST.dur;
  const tLocal = Math.max(0, t - t0);
  const durLinha = Math.max(0.6, t1 - t0);

  // animacoes deterministas: cada mixer no segundo t (loop cuida da repeticao)
  for (const id of Object.keys(atores)) if (atores[id].obj.visible) atores[id].setTime(t);
  if (criaturaAtiva && criaturaAtiva.setTime) criaturaAtiva.setTime(t);
  if (luzCtrl) luzCtrl.atualizar(t);

  // camera: plano do roteiro ou sequencia automatica (troca a cada ~2,5 s), com travelling lento
  const base = cena.plano || 'auto';
  const pa = planoAutomatico(tLocal, durLinha, base);
  const tremor = (cena.tremor || 0) + sustoEm(t);

  // qual e o ALVO da camera: o ator principal da cena; se nao houver ator, a criatura; senao, a marca.
  const alvo = alvoDaCena(cena, pa.plano);

  // rosto de frente: nos planos close/medio o ator vira levemente para a camera (ate 35 graus)
  if (alvo && alvo.ehAtor && (pa.plano === 'close' || pa.plano === 'medio')) {
    virarParaCamera(alvo, 35);
  } else if (alvo && alvo.ehAtor) {
    alvo.obj.rotation.y = alvo._ryBase ?? alvo.obj.rotation.y;
  }

  // fundo: em plano aberto/aereo com ator, a camera fica do lado oposto a um objeto principal (assunto ao fundo)
  let fundo = null;
  if (alvo && !alvo.ehObjeto && (pa.plano === 'aberto' || pa.plano === 'aereo')) {
    alvo.obj.getWorldPosition(_tmpVec);
    const pr = principalPerto(_tmpVec.x, _tmpVec.z, 18, alvo.obj);
    if (pr) { _boxTmp.setFromObject(pr); fundo = _boxTmp.getCenter(new THREE.Vector3()); }
  }
  const paredes = principais.filter(o => o !== (alvo && alvo.obj)).map(o => new THREE.Box3().setFromObject(o));
  const diag = aplicarPlano(cam, pa.plano, alvo, pa.tLocal, { dur: pa.dur, tremor, obstaculos, fov: 42, fundo,
                            limites: cenarioAtual.limites, paredes });

  // rim light azulada atras do alvo, na direcao da camera, para recortar do fundo
  if (rim && alvo) posicionarRim(alvo);

  // TODOS os troncos/casas entre a camera e o alvo SOMEM neste quadro (regra r3: nao basta orbitar)
  const escondidos = ((diag && diag.bloqueadores) || []).filter(o => !(alvo && o === alvo.obj));
  // alem disso, esconde QUALQUER obstaculo que ocupe > 22% da tela OU esteja muito perto da camera (tronco/copa
  // gigante de lado), proibido na r3. A proximidade pega os casos em que a caixa cruza o plano da camera.
  for (const o of obstaculos) {
    if (!o.visible || escondidos.includes(o) || principais.includes(o)) continue;
    if (coberturaTela(o) > 0.19 || pertoDaCamera(o, 4.5)) escondidos.push(o);
  }
  for (const o of escondidos) o.visible = false;
  window.__escondidosQuadro = escondidos; // o fiscal (obstaculo) respeita estes esconderijos

  // dados para o fiscal (conferir_quadros.py): plano, se o alvo e ator, e se segue bloqueado DEPOIS de esconder
  window.__ultimoQuadro = { plano: pa.plano, alvoEhAtor: !!(alvo && alvo.ehAtor), alvoEhObjeto: !!(alvo && alvo.ehObjeto), bloqueado: false, cena: ST._iAtual,
                            temCriatura: !!(cena && cena.criatura) };
  _alvoAtual = alvo;

  if (_silhueta) desenharSilhueta(alvo); else comp.render();
  for (const o of escondidos) o.visible = true; // restaura para os proximos quadros
  desenharLegenda(t);
};

// pulso de susto deterministico a partir dos eventos (tremor curto)
function sustoEm(t) {
  let s = 0;
  for (const e of (ST.eventos || [])) {
    if ((e.tipo === 'susto' || e.tipo === 'golpe')) {
      const d = t - e.t;
      if (d >= 0 && d < 0.4) s = Math.max(s, (1 - d / 0.4));
    }
  }
  return s;
}

// fila de montagem de cena (async) sem travar o quadro
let _montando = false, _fila = null;
function garantirCena(i) {
  _fila = i;
  if (_montando) return;
  _montando = true;
  (async () => {
    while (_fila !== null && _fila !== ST._iAtual) {
      const alvo = _fila; _fila = null;
      await trocarPara(alvo);
    }
    _montando = false;
  })();
}

// ------- legenda: UMA palavra no centro, Fredoka branca com contorno preto, amarelo p/ destaque -------
function desenharLegenda(t) {
  lx.clearRect(0, 0, W, H);
  if (window.__semLegenda || !ST.segs) return;
  const s = ST.segs.find(s => t >= s.t0 - 0.05 && t <= s.t1 + 0.25);
  if (!s) return;
  const words = s.text.split(' ').filter(Boolean);
  // tempo de cada palavra = alinhamento forcado (sincronia.py). A palavra so aparece quando a voz a fala.
  let k = -1;
  if (s.w && s.w.length === words.length) {
    for (let i = 0; i < words.length; i++) if (s.w[i] <= t) k = i;
  } else {
    // sem alinhamento: distribui pelo tempo do seg
    const prog = (t - s.t0) / Math.max(0.1, s.t1 - s.t0);
    k = Math.min(words.length - 1, Math.floor(prog * words.length));
  }
  if (k < 0) return;
  const bruta = words[k];
  const palavra = bruta.replace(/\*/g, ''); // asteriscos nao aparecem; so marcam amarelo
  const limpa = palavra.replace(/[^\p{L}\p{N}']/gu, '');
  const amarela = /\*/.test(bruta) || (ST.destaqueRX && ST.destaqueRX.test(limpa));

  // "pop" curto quando a palavra entra (deterministico): escala 1.12 -> 1.0 em 0.12 s
  const entrou = (s.w && s.w.length === words.length) ? (t - s.w[k]) : 0;
  const pop = entrou >= 0 && entrou < 0.12 ? 1 + (0.12 - entrou) * 1.0 : 1;

  lx.save();
  lx.textAlign = 'center'; lx.textBaseline = 'middle';
  const yc = H * 0.5; // zona segura central do Shorts
  lx.translate(W / 2, yc); lx.scale(pop, pop);
  lx.font = '700 128px Fredoka, "Baloo 2", system-ui, sans-serif';
  lx.lineJoin = 'round'; lx.miterLimit = 2;
  // contorno preto grosso
  lx.lineWidth = 24; lx.strokeStyle = '#000'; lx.strokeText(palavra, 0, 0);
  // preenchimento branco (ou amarelo p/ destaque)
  lx.fillStyle = amarela ? '#ffd23e' : '#ffffff';
  lx.fillText(palavra, 0, 0);
  lx.restore();
}

// O render.py captura o quadro com document.getElementById('c').toDataURL(...). O 3D esta no canvas WebGL 'c'
// e a legenda num canvas 2D separado 'leg'. Para o JPG sair com a legenda JUNTO, trocamos cv.toDataURL por uma
// versao que compoe os dois num terceiro canvas e devolve o DataURL dele (mesma assinatura, mesmo contrato).
const outCv = document.createElement('canvas'); outCv.width = W; outCv.height = H;
const outCtx = outCv.getContext('2d');
cv.toDataURL = function (type = 'image/jpeg', q = 0.9) {
  outCtx.clearRect(0, 0, W, H);     // limpa o composto (senao a legenda do quadro anterior fica sobreposta)
  outCtx.drawImage(cv, 0, 0);       // o 3D ja renderizado (preserveDrawingBuffer=true garante que persiste)
  outCtx.drawImage(legCv, 0, 0);    // a legenda por cima
  return outCv.toDataURL(type, q);
};

// garante que a cena do instante t esteja montada ANTES de desenhar o quadro (o render.py aguarda esta promessa
// em 3D, para nenhum quadro sair com a cena anterior). Resolve na hora se ja estiver montada.
window.prepararQuadro = async function (t) {
  if (!montado) return false;
  const i = cenaEm(t);
  if (i !== ST._iAtual || _montando) {
    await trocarPara(i);
  }
  return true;
};

// --- modo fiscal: silhueta do alvo em magenta sobre fundo preto (mede quanto o ator ocupa na tela) ---
const _matMagenta = new THREE.MeshBasicMaterial({ color: 0xff00ff });
const _matPreto = new THREE.MeshBasicMaterial({ color: 0x000000 });
const _matCiano = new THREE.MeshBasicMaterial({ color: 0x00ffff });
function desenharSilhueta(alvo) {
  // guarda materiais, pinta tudo de preto, o alvo de magenta, renderiza SEM bloom, restaura
  const trocados = [];
  scene.traverse(o => {
    if (o.isMesh && o.material) { trocados.push([o, o.material]); o.material = _matPreto; }
  });
  // objetos principais visiveis (casa, torre, poste...) em ciano: o fiscal soma alvo+principais = "assunto"
  for (const pr of principais) if (pr.visible && !(alvo && pr === alvo.obj)) pr.traverse(o => { if (o.isMesh) o.material = _matCiano; });
  if (alvo && alvo.obj) alvo.obj.traverse(o => { if (o.isMesh) o.material = _matMagenta; });
  const bg = scene.background; scene.background = new THREE.Color(0x000000);
  const fog = scene.fog; scene.fog = null;
  R.render(scene, cam); // render direto (sem composer/bloom)
  scene.fog = fog;
  scene.background = bg;
  for (const [o, m] of trocados) o.material = m;
}
window.__silhueta = (on) => { _silhueta = !!on; };

// fiscal (b): maior fracao da tela ocupada por UM objeto de cenario (tronco/casa) que NAO e ator/criatura.
// Pinta cada obstaculo de uma cor unica, renderiza sem bloom, e mede a maior contagem de uma cor.
window.__obstaculoCobertura = () => {
  const trocados = [];
  scene.traverse(o => { if (o.isMesh && o.material) { trocados.push([o, o.material]); o.material = _matPreto; } });
  // cada obstaculo de topo ganha uma cor unica; os que o quadro ESCONDEU continuam pretos (nao contam)
  const escond = window.__escondidosQuadro || [];
  const cores = [];
  obstaculos.forEach((ob, i) => {
    if (escond.includes(ob) || principais.includes(ob) || (_alvoAtual && ob === _alvoAtual.obj)) { cores.push(null); return; }
    const cor = new THREE.Color().setHSL((i * 0.137) % 1, 1, 0.5);
    cores.push(cor);
    ob.traverse(o => { if (o.isMesh) o.material = new THREE.MeshBasicMaterial({ color: cor }); });
  });
  // esconde ator/criatura para nao contar
  const alvo = _alvoAtual;
  const bg = scene.background; scene.background = new THREE.Color(0x000000);
  R.render(scene, cam);
  scene.background = bg;
  for (const [o, m] of trocados) o.material = m;
  return cores.length; // o calculo da fracao e feito no Python lendo os pixels (cores distintas)
};

// diagnostico: posicao/alvo da camera e se a cena tem objetos visiveis
window.__caminfo = () => ({
  cam: cam ? [Math.round(cam.position.x), Math.round(cam.position.y), Math.round(cam.position.z)] : null,
  objs: scene ? scene.children.length : 0,
  cenario: cenarioNome, luz: luzNome,
});
// diagnostico: exporta SO o canvas WebGL cru (sem a legenda), para isolar se o 3D esta preto
window.__cru = (q = 0.9) => {
  const o = document.createElement('canvas'); o.width = W; o.height = H;
  o.getContext('2d').drawImage(cv, 0, 0);
  return o.toDataURL('image/jpeg', q).split(',')[1];
};

// pequeno log para a prova manual
window.estado = () => ({ pronto: window.pronto, cenas: ST && ST._cenas.length, atores: Object.keys(atores), iAtual: ST && ST._iAtual });
</script>
