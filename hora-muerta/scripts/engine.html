    itens.forEach((it, i) => {
      const ok = i < marc, yy = 116 + i * 70;
      x.fillStyle = T.tinta; x.font = fonte('fonteTxt', 44); x.fillText((i + 1) + '.  ' + it, 40, yy);
      if (ok) { x.strokeStyle = CALMO() ? T.ok : T.perigo; x.lineWidth = 6; x.lineCap = 'round'; x.beginPath(); x.moveTo(w - 110, yy); x.lineTo(w - 90, yy + 20); x.lineTo(w - 50, yy - 26); x.stroke(); }
    });
    x.restore();
  } else {
    x.font = fonte('fonteTit', 42); const w = x.measureText(c.titulo || '').width + 70;
    x.save(); x.translate(W / 2, cy + 40); x.rotate(CALMO() ? 0 : -0.04);
    x.fillStyle = c.fundo || T.destaque; x.fillRect(-w / 2, -40, w, 80); x.fillStyle = c.cor || T.tinta; x.textAlign = 'center'; x.fillText(c.titulo || '', 0, 2);
    x.restore();
  }
  x.restore();
}

// PECA-EXEMPLO: close de um personagem (serve para qualquer canal). Fundo muda sozinho pelo canal.
// p = {pessoa:{...opcoes de pessoa()}, zoomRosto:0..1 ou [de,ate], janela:true (janela com lua/sol atras), fundo:[c1,c2], luz:[x,y,r,cor]}
COMP.retrato = (t, lt, p) => {
  const T = TF(), f = p.fundo || [T.fundo1, T.fundo2];
  fundoFlat(f[0], f[1], p.luz || [0.25, 0.3, 520]);
  if (p.janela !== false) {
    // janela em arco (CL) ou janela com cortina e lua (HM)
    const jx = W * 0.72, jy = H * 0.24, jw = 230, jh = 330;
    x.fillStyle = 'rgba(0,0,0,0.3)'; x.beginPath(); x.roundRect(jx - jw / 2 - 16, jy - 16, jw + 32, jh + 32, CALMO() ? [130, 130, 8, 8] : 8); x.fill();
    x.fillStyle = CALMO() ? '#c9d7e0' : '#2f3f6a'; x.beginPath(); x.roundRect(jx - jw / 2, jy, jw, jh, CALMO() ? [115, 115, 4, 4] : 4); x.fill();
    if (!CALMO()) { glow(jx + 40, jy + 90, 120, 'rgba(255,250,220,0.35)'); x.fillStyle = '#f3ecd2'; x.beginPath(); x.arc(jx + 40, jy + 90, 34, 0, 7); x.fill(); }
    else { x.fillStyle = '#7d9a63'; x.beginPath(); x.ellipse(jx, jy + jh, jw * 0.7, 90, 0, Math.PI, 0); x.fill(); }
    x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(jx - 4, jy, 8, jh); x.fillRect(jx - jw / 2, jy + jh * 0.5, jw, 8);
    if (!CALMO()) { const bal = Math.sin(t * 0.8) * 10; x.fillStyle = '#6b2a3a'; x.beginPath(); x.moveTo(jx - jw / 2 - 20, jy - 20); x.quadraticCurveTo(jx - jw / 2 + 40 + bal, jy + jh * 0.5, jx - jw / 2 - 10, jy + jh + 30); x.lineTo(jx - jw / 2 - 40, jy + jh + 30); x.lineTo(jx - jw / 2 - 40, jy - 20); x.fill(); }
  }
  // vela acesa no canto (HM) ou fogo baixo (CL): luz que mexe
  const fx = W * 0.14, fy = H * 0.5, k = 0.8 + 0.2 * Math.sin(t * 7) + 0.1 * Math.sin(t * 17);
  glow(fx, fy - 60, 260 * k, CALMO() ? 'rgba(255,170,80,0.25)' : 'rgba(246,178,74,0.3)');
  if (!CALMO()) { x.fillStyle = T.papel; x.fillRect(fx - 18, fy - 40, 36, 110); x.fillStyle = '#ffd27a'; x.beginPath(); x.ellipse(fx, fy - 62, 11, 22 * k, 0, 0, 7); x.fill(); }
  const zr = rng(p.zoomRosto ?? 0, lt), s = 1.2 + zr * 0.45;
  // queixo acima de 62% da altura: a legenda fica no peito, nunca em cima da boca
  pessoa(W / 2, H * 0.53 - zr * 90, s, { ...(p.pessoa || {}), t });
};

// ---------- pecas flat do Hora Muerta (item 19 do PLANO-MUNDOS) ----------
// camera da peca: p.foco = [x, y] (0..1) vai para o centro e p.escala (numero ou [de, ate]) aproxima. Ex.: {"foco": [0.55, 0.52], "escala": [1.6, 1.9]}
function camFlat(p, lt) {
  if (!p.foco) return;
  const e = Math.max(1, rng(p.escala ?? 1.6, lt));
  // trava o foco para a camera nunca mostrar fora do cenario (borda preta)
  const fx = Math.min(Math.max(p.foco[0], 0.5 / e), 1 - 0.5 / e), fy = Math.min(Math.max(p.foco[1], 0.42 / e), 1 - 0.58 / e);
  x.translate(W / 2, H * 0.42); x.scale(e, e); x.translate(-fx * W, -fy * H);
}
// pessoa de corpo inteiro (pequena, para cenarios). base = pes; s = escala (1 = ~360 px de altura)
// o = {pele, cabelo, cabeloTipo, roupa, saia, lanterna, anda (velocidade do passo), olhar:-1|1 (lado), sombra:true}
function corpoFlat(cx, base, s, o = {}, t = 0) {
  const pele = o.pele || PAL.pele[2], roupa = o.roupa || '#4a3a6a', cab = o.cabelo || '#2e1d14', ld = o.olhar || 1;
  const passo = o.anda ? Math.sin(t * o.anda * 6) : 0;
  x.save(); x.translate(cx, base); x.scale(s * ld, s);
  if (o.sombra !== false) { x.fillStyle = 'rgba(0,0,0,0.25)'; x.beginPath(); x.ellipse(30, 0, 90, 14, 0, 0, 7); x.fill(); }
  // pernas
  x.fillStyle = '#231a2e';
  x.save(); x.translate(-16, -120); x.rotate(passo * 0.35); x.beginPath(); x.roundRect(-11, 0, 22, 120, 10); x.fill(); x.restore();
  x.save(); x.translate(16, -120); x.rotate(-passo * 0.35); x.beginPath(); x.roundRect(-11, 0, 22, 120, 10); x.fill(); x.restore();
  // corpo (vestido/saia ou casaco)
  x.fillStyle = roupa; x.beginPath();
  if (o.saia) { x.moveTo(-34, -250); x.lineTo(34, -250); x.lineTo(62, -70); x.lineTo(-62, -70); }
  else { x.moveTo(-36, -250); x.lineTo(36, -250); x.lineTo(42, -110); x.lineTo(-42, -110); }
  x.fill(); x.beginPath(); x.ellipse(0, -248, 40, 22, 0, 0, 7); x.fill();
  // braco com lanterna
  x.save(); x.translate(26, -235); x.rotate(-0.25 + passo * 0.15); x.fillStyle = roupa; x.beginPath(); x.roundRect(-9, 0, 18, 100, 9); x.fill();
  x.fillStyle = pele; x.beginPath(); x.arc(0, 104, 11, 0, 7); x.fill();
  const kl = 0.85 + 0.15 * Math.sin(t * 9);
  if (o.lanterna) { x.fillStyle = '#2a1f1a'; x.fillRect(-14, 112, 28, 6); x.fillStyle = `rgba(255,205,110,${kl})`; x.beginPath(); x.roundRect(-13, 118, 26, 36, 6); x.fill(); }
  x.restore();
  // cabeca com rosto
  x.fillStyle = pele; x.beginPath(); x.ellipse(0, -300, 40, 44, 0, 0, 7); x.fill();
  x.fillStyle = cab; x.beginPath(); x.ellipse(0, -322, 42, 26, 0, Math.PI, 0); x.fill();
  if (o.capuz) { x.fillStyle = o.corCapuz || roupa; x.beginPath(); x.ellipse(-4, -308, 52, 58, 0, Math.PI * 0.95, Math.PI * 2.05); x.fill(); x.beginPath(); x.moveTo(-50, -300); x.lineTo(-40, -250); x.lineTo(30, -250); x.lineTo(-10, -300); x.fill(); }
  if (o.touca) { x.fillStyle = o.corTouca || '#efe4cc'; x.beginPath(); x.ellipse(0, -318, 48, 34, 0, Math.PI, 0); x.fill(); x.fillRect(-46, -322, 20, 50); }
  if (o.cabeloTipo === 'coque') { x.beginPath(); x.arc(-6, -352, 16, 0, 7); x.fill(); }
  x.fillStyle = '#1c1220'; x.beginPath(); x.ellipse(10, -302, 4.5, 6.5, 0, 0, 7); x.ellipse(28, -302, 4.5, 6.5, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(220,90,80,0.3)'; x.beginPath(); x.ellipse(30, -288, 8, 5, 0, 0, 7); x.fill();
  x.restore();
  if (o.lanterna) glow(cx + 40 * s * ld, base - 100 * s, 160 * s, `rgba(246,178,74,${0.35 * kl})`);
}
// flor de cempasuchil (bolinha laranja com miolo)
function cempa(cx, cy, r) { x.fillStyle = '#ff8a2a'; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.fillStyle = '#ffb347'; x.beginPath(); x.arc(cx - r * 0.25, cy - r * 0.25, r * 0.5, 0, 7); x.fill(); }
// vela no chao (cx, base); acesa 0..1
function velaFlat(cx, base, s, acesa, t) {
  x.fillStyle = '#efe4cc'; x.beginPath(); x.roundRect(cx - 9 * s, base - 46 * s, 18 * s, 46 * s, 3 * s); x.fill();
  if (acesa > 0.02) {
    const k = 0.85 + 0.1 * Math.sin(t * 11 + cx) + 0.05 * Math.sin(t * 23);
    glow(cx, base - 60 * s, 120 * s * k, `rgba(246,178,74,${0.45 * acesa})`);
    x.fillStyle = `rgba(255,214,122,${acesa})`; x.beginPath(); x.ellipse(cx + Math.sin(t * 7) * 1.5 * s, base - 60 * s, 7 * s, 15 * s * k, 0, 0, 7); x.fill();
  } else { x.strokeStyle = 'rgba(220,220,230,0.35)'; x.lineWidth = 3; x.beginPath(); for (let i = 0; i < 6; i++) { const yy = base - 50 * s - i * 14; x.lineTo(cx + Math.sin(t * 2 + i) * 8, yy); } x.stroke(); }
}

// f_panteon: cemiterio de povoado latino a noite. Lua, morros, cruzes, lapides arredondadas com cempasuchil,
// portao de ferro a esquerda, tumba sem nome no centro com vela.
// p = {reja: 0..1 (portao aberto) ou [de, ate], vela: 0..1 (vela da tumba acesa), tumba: 0..1 (tampa da tumba sem nome
//      deslocada), nota: true (papel preso no portao), marta: {x: 0..1, ...opcoes de corpoFlat} (pessoa no cenario),
//      foco/escala (camera, ver camFlat), lua: true}
// Ex.: {"comp": "f_panteon", "p": {"vela": 1, "marta": {"x": 0.3, "lanterna": true, "cabeloTipo": "coque", "cabelo": "#b9b2a8", "saia": true}}}
COMP.f_panteon = (t, lt, p) => {
  const T = TF();
  x.save(); camFlat(p, lt);
  fundoFlat('#3a2c58', '#161126');
  // estrelas e lua
  for (let i = 0; i < 40; i++) { const a = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.3 + i * 7)); x.fillStyle = `rgba(255,245,225,${0.5 * a})`; x.beginPath(); x.arc(rnd(i) * W, rnd(i * 3.1) * H * 0.38, 1.5 + rnd(i * 5) * 2, 0, 7); x.fill(); }
  if (p.lua !== false) { glow(W * 0.22, H * 0.1, 260, 'rgba(255,248,225,0.22)'); x.fillStyle = '#f3ecd2'; x.beginPath(); x.arc(W * 0.22, H * 0.1, 70, 0, 7); x.fill(); x.fillStyle = 'rgba(200,190,170,0.35)'; x.beginPath(); x.arc(W * 0.2, H * 0.09, 14, 0, 7); x.arc(W * 0.24, H * 0.12, 9, 0, 7); x.fill(); }
  // nuvens que passam
  for (let i = 0; i < 3; i++) { const nx = ((t * (10 + i * 6) + i * 420) % (W + 500)) - 250, ny = H * (0.08 + i * 0.07); x.fillStyle = 'rgba(120,100,160,0.25)'; x.beginPath(); x.roundRect(nx - 160, ny - 26, 320, 52, 26); x.fill(); }
  // morros e igreja ao longe
  x.fillStyle = '#2b2142'; x.beginPath(); x.moveTo(0, H * 0.32); x.quadraticCurveTo(W * 0.25, H * 0.24, W * 0.5, H * 0.3); x.quadraticCurveTo(W * 0.78, H * 0.23, W, H * 0.29); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  { const ig = W * 0.6, iy = H * 0.2; x.fillStyle = '#231b37'; x.fillRect(ig, iy, 60, 120); x.beginPath(); x.moveTo(ig - 8, iy); x.lineTo(ig + 30, iy - 0.035 * H); x.lineTo(ig + 68, iy); x.fill(); x.fillRect(ig + 27, iy - 0.055 * H, 6, 24); x.fillRect(ig + 19, iy - 0.048 * H, 22, 6); }
  // chao
  const g = x.createLinearGradient(0, H * 0.33, 0, H); g.addColorStop(0, '#2e2440'); g.addColorStop(1, '#1d1628'); x.fillStyle = g; x.beginPath(); x.moveTo(0, H * 0.34); x.quadraticCurveTo(W / 2, H * 0.32, W, H * 0.34); x.lineTo(W, H); x.lineTo(0, H); x.fill();
  // muro do fundo
  x.fillStyle = '#4a3c62'; x.fillRect(0, H * 0.315, W, 30); x.fillStyle = '#5a4a74'; x.fillRect(0, H * 0.315, W, 7);
  // fileiras de cruzes e lapides (fundo menor, frente maior)
  const fila = (y, s, n, sd) => {
    for (let i = 0; i < n; i++) {
      const cx = (i + 0.5) / n * W + (rnd(i + sd) - 0.5) * 60; if (Math.abs(cx - W * 0.58) < (y > H * 0.6 ? 330 : 150) * s / (y > H * 0.6 ? 1.6 : 1) && y > H * 0.4) continue;
      x.fillStyle = y < H * 0.36 ? '#5c4d78' : y < H * 0.6 ? '#6e5e8c' : '#7d6d9a';
      if (rnd(i * 2 + sd) > 0.5) { x.fillRect(cx - 7 * s, y - 90 * s, 14 * s, 90 * s); x.fillRect(cx - 30 * s, y - 70 * s, 60 * s, 13 * s); }
      else { x.beginPath(); x.roundRect(cx - 30 * s, y - 80 * s, 60 * s, 80 * s, [30 * s, 30 * s, 4, 4]); x.fill(); }
      cempa(cx - 18 * s, y - 4 * s, 9 * s); cempa(cx + 16 * s, y - 2 * s, 8 * s);
    }
  };
  fila(H * 0.355, 0.7, 9, 1); fila(H * 0.43, 1.0, 6, 7);
  // caminho de petalas de cempasuchil ate a tumba
  for (let i = 0; i < 70; i++) { const u = rnd(i * 1.3), yy = lerp(H * 0.98, H * 0.56, u), xx = lerp(W * 0.5, W * 0.58, u) + (rnd(i * 4.7) - 0.5) * lerp(260, 90, u); x.fillStyle = rnd(i) > 0.5 ? '#ff8a2a' : '#f6b24a'; x.beginPath(); x.ellipse(xx, yy, lerp(10, 4, u), lerp(6, 3, u), rnd(i * 9) * 3, 0, 7); x.fill(); }
  // tumba sem nome no centro
  const tx = W * 0.58, ty = H * 0.55, tb = rng(p.tumba ?? 0, lt);
  x.save(); x.translate(tx, ty); x.scale(1.3, 1.3); x.translate(-tx, -ty);
  x.fillStyle = 'rgba(0,0,0,0.3)'; x.beginPath(); x.ellipse(tx + 20, ty + 8, 200, 26, 0, 0, 7); x.fill();
  x.fillStyle = '#5a4a70'; x.beginPath(); x.roundRect(tx - 170, ty - 70, 340, 80, 10); x.fill();
  if (tb > 0.01) { x.fillStyle = '#0c0814'; x.beginPath(); x.roundRect(tx - 150, ty - 66, 300, 40, 6); x.fill(); glow(tx, ty - 50, 120 * tb, `rgba(127,224,196,${0.25 * tb})`); }
  x.save(); x.translate(tx + tb * 120, ty - 72 - tb * 10); x.rotate(tb * 0.12); x.fillStyle = '#7a6a96'; x.beginPath(); x.roundRect(-180, -22, 360, 30, 8); x.fill(); x.restore();
  x.fillStyle = '#7a6a96'; x.beginPath(); x.roundRect(tx - 70, ty - 250, 140, 190, [70, 70, 6, 6]); x.fill();
  x.fillStyle = '#5a4a70'; x.font = fonte('fonteTit', 44); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', tx, ty - 170);
  velaFlat(tx - 120, ty - 70, 1.2, rng(p.vela ?? 1, lt), t);
  cempa(tx + 110, ty - 78, 14); cempa(tx + 140, ty - 74, 12); cempa(tx + 125, ty - 92, 11);
  x.restore();
  fila(H * 0.83, 1.6, 4, 13);
  for (let i = 0; i < 18; i++) { const gx2 = rnd(i * 3.3) * W, gy2 = H * (0.9 + rnd(i * 1.9) * 0.08); x.fillStyle = '#2a3a3a'; for (let k = -1; k <= 1; k++) { x.beginPath(); x.moveTo(gx2 + k * 10, gy2); x.quadraticCurveTo(gx2 + k * 18 + Math.sin(t * 1.5 + i) * 4, gy2 - 30, gx2 + k * 22, gy2 - 44); x.lineTo(gx2 + k * 10 + 6, gy2); x.fill(); } }
  // portao de ferro a esquerda (frente)
  const rj = rng(p.reja ?? 0, lt), gx = W * 0.02, gy = H * 0.7;
  x.save(); x.translate(gx, gy); x.scale(1.25, 1.25); x.translate(-gx, -gy);
  x.fillStyle = '#2a2236'; x.fillRect(gx - 30, gy - 520, 52, 560); x.fillStyle = '#3a3050'; x.beginPath(); x.arc(gx - 4, gy - 530, 34, 0, 7); x.fill();
  x.save(); x.translate(gx + 22, gy); x.scale(1 - rj * 0.75, 1);
  x.strokeStyle = '#1a1424'; x.lineWidth = 10;
  for (let i = 0; i < 6; i++) { const bx = 20 + i * 52; x.beginPath(); x.moveTo(bx, 30); x.lineTo(bx, -430); x.stroke(); x.fillStyle = '#1a1424'; x.beginPath(); x.moveTo(bx - 12, -430); x.lineTo(bx, -462); x.lineTo(bx + 12, -430); x.fill(); }
  x.lineWidth = 12; x.beginPath(); x.moveTo(0, -380); x.lineTo(300, -380); x.moveTo(0, -60); x.lineTo(300, -60); x.stroke();
  x.strokeStyle = '#ff8a2a'; x.lineWidth = 4; x.beginPath(); x.arc(150, -220, 50, 0, 7); x.stroke();
  if (p.nota) { const bal = Math.sin(t * 2.2) * 0.06; x.save(); x.translate(120, -250); x.rotate(-0.08 + bal); x.fillStyle = T.papel; x.fillRect(-55, 0, 110, 120); x.strokeStyle = 'rgba(42,26,20,0.5)'; x.lineWidth = 3; for (let l = 0; l < 4; l++) { x.beginPath(); x.moveTo(-40, 30 + l * 22); x.lineTo(30 - (l === 3 ? 30 : 0), 30 + l * 22); x.stroke(); } x.fillStyle = 'rgba(255,255,240,0.6)'; x.fillRect(-30, -10, 60, 20); x.restore(); }
  x.restore(); x.restore();
  // pessoa no cenario
  if (p.marta) corpoFlat(rng(p.marta.x ?? 0.32, lt) * W, H * (p.marta.y ?? 0.88), p.marta.s ?? 1.2, p.marta, t);
  // neblina clara rente ao chao
  for (let i = 0; i < 4; i++) { const nx = ((t * (14 + i * 5) + i * 330) % (W + 600)) - 300; x.fillStyle = 'rgba(190,170,230,0.07)'; x.beginPath(); x.ellipse(nx, H * (0.42 + i * 0.1), 360, 40, 0, 0, 7); x.fill(); }
  x.restore();
};

// f_pueblo: rua de povoado latino a noite. Casas coloridas com telhado de telha, papel picado balancando entre as casas,
// poste com luz, igreja com sino, cachorro. A casa da direita e "a casa da personagem".
// p = {janelas: 0..1 (fracao de janelas acesas), casa: 'apagada'|'acesa'|'vulto' (janela da casa da direita; 'vulto' = alguem
//      sentado esperando), porta: 0..1 (porta da casa da direita aberta), marta: {x, ...corpoFlat} (anda se tiver "anda"),
//      cachorro: true, amanhecer: 0..1 (ceu clareia), chamado: "texto" (balao de voz vindo de longe), foco/escala}
// Ex.: {"comp": "f_pueblo", "p": {"janelas": 0.2, "casa": "vulto", "marta": {"x": [0.2, 0.45], "anda": 1, "saia": true}}}
COMP.f_pueblo = (t, lt, p) => {
  const T = TF(), am = rng(p.amanhecer ?? 0, lt);
  x.save(); camFlat(p, lt);
  const c1 = am > 0 ? `rgb(${Math.round(42 + am * 160)},${Math.round(31 + am * 110)},${Math.round(61 + am * 60)})` : '#2a1f3d';
  fundoFlat(c1, am > 0 ? `rgb(${Math.round(20 + am * 220)},${Math.round(15 + am * 140)},${Math.round(34 + am * 80)})` : '#140f22');
  for (let i = 0; i < 30; i++) { x.fillStyle = `rgba(255,245,225,${0.45 * (1 - am) * (0.5 + 0.5 * Math.sin(t + i))})`; x.beginPath(); x.arc(rnd(i * 1.7) * W, rnd(i * 2.3) * H * 0.3, 2, 0, 7); x.fill(); }
  // igreja no fundo
  const ix = W * 0.5; x.fillStyle = '#3a2d52'; x.fillRect(ix - 110, H * 0.17, 220, H * 0.2); x.fillRect(ix - 50, H * 0.1, 100, 140);
  x.beginPath(); x.moveTo(ix - 60, H * 0.1); x.lineTo(ix, H * 0.065); x.lineTo(ix + 60, H * 0.1); x.fill(); x.fillRect(ix - 4, H * 0.04, 8, 50); x.fillRect(ix - 18, H * 0.05, 36, 8);
  const sino = Math.sin(t * 2) * 0.3; x.save(); x.translate(ix, H * 0.115); x.rotate(sino * (p.sino ? 1 : 0.1)); x.fillStyle = '#c99a40'; x.beginPath(); x.moveTo(-18, 30); x.quadraticCurveTo(-16, 0, 0, 0); x.quadraticCurveTo(16, 0, 18, 30); x.fill(); x.restore();
  // rua em perspectiva
  x.fillStyle = '#3a2f48'; x.beginPath(); x.moveTo(W * 0.4, H * 0.36); x.lineTo(W * 0.6, H * 0.36); x.lineTo(W * 1.1, H); x.lineTo(-W * 0.1, H); x.fill();
  x.fillStyle = 'rgba(0,0,0,0.15)'; for (let i = 0; i < 9; i++) { const yy = H * (0.4 + i * i * 0.008); x.fillRect(0, yy, W, 3); }
  // casas dos dois lados
  const cores = ['#3f6d6a', '#8a4a5e', '#a8763a', '#4d5a8f', '#6b4a7a', '#7a5a3a'];
  const casa = (lado, i) => {
    const prof = i / 3, sx = lado < 0 ? W * (-0.04 + prof * 0.33) : W * (1.04 - prof * 0.33), w = 430 * (1 - prof * 0.6), h = 760 * (1 - prof * 0.6), base = H * (0.82 - prof * 0.4);
    const px = lado < 0 ? sx : sx - w, cor = cores[(i * 2 + (lado > 0 ? 1 : 0)) % cores.length];

function ceuMedieval(ceu) {
  const C = { aurora: ['#e9b48a', '#f6dcb2', [0.78, 0.3, '#ffd59a']], dia: ['#8fb7d6', '#d8e7ee', [0.75, 0.12, '#fff1c4']],

  fundoFlat(C[0], C[1]); const s = C[2];
  glow(s[0] * W, s[1] * H, 280, ceu === 'noite' ? 'rgba(255,248,225,0.18)' : 'rgba(255,230,160,0.35)');

    x.textAlign = 'center'; x.textBaseline = 'middle';

      x.fillStyle = big ? '#f2c66d' : '#efe3cc'; x.shadowColor = big ? 'rgba(255,190,90,0.6)' : 'transparent'; x.shadowBlur = big ? 24 : 0;

// ---------------- legenda e quadro ----------------
function subtitle(t) {
  if (window.__semLegenda) return;
  const s = ST.segs.find(s => t >= s.t0 - 0.05 && t <= s.t1 + 0.25);
  if (!s) return;
  const words = s.text.split(' ').filter(Boolean), chunks = [], ini = [];
  for (let i = 0; i < words.length;) { let n = 0, len = 0; while (i + n < words.length && (n < 2 || len < 16) && n < 5) { len += words[i + n].length + 1; n++; if (/[.?!…:]$/.test(words[i + n - 1])) break; } chunks.push(words.slice(i, i + n).join(' ')); ini.push(i); i += n; }
  let cur = chunks[chunks.length - 1], nVis = 99;
  if (s.w && s.w.length === words.length) {
    // tempo de cada palavra = alinhamento forcado da voz final (motor-en/sincronia.py, ja 1 quadro antes da voz).
    // Estilo stories do Instagram (pedido do Pedro, 30/10): o bloco monta palavra por palavra, cada uma so entra
    // quando a voz a fala. Nada de somar adianto aqui: o +0,1 s antigo mostrava o bloco inteiro antes da voz.
    let k = -1; for (let i = 0; i < words.length; i++) if (s.w[i] <= t) k = i;
    if (k < 0) return;
    let c = 0; for (let j = 0; j < chunks.length; j++) if (ini[j] <= k) c = j;
    cur = chunks[c]; nVis = k - ini[c] + 1;
  } else {
    const total = chunks.reduce((a, b) => a + b.length, 0), pp = (t - s.t0) / (s.t1 - s.t0) * total;
    let acc = 0;
    for (const ch of chunks) { acc += ch.length; if (pp <= acc) { cur = ch; break; } }
  }
  x.font = '900 76px "Arial Black", Impact, system-ui, sans-serif'; x.textAlign = 'left'; x.textBaseline = 'middle';
  const FL = FLAT(), UP = w => FL ? w : w.toUpperCase();
  if (FL) x.font = '900 70px "Arial Black", Impact, system-ui, sans-serif';
  // quebra de linha pelo bloco INTEIRO: as palavras que ainda vao entrar ja tem lugar e o texto nao pula
  const lines = []; let line = [];
  for (const w of cur.split(' ')) { const test = [...line, w].join(' '); if (x.measureText(UP(test)).width > W - 300 && line.length) { lines.push(line); line = [w]; } else line.push(w); }
  lines.push(line);
  let n = 0;
  lines.forEach((ws, i) => {
    // zona segura do Shorts: o rodape (nome do canal, Inscrever-se, descricao) cobre de ~72% para baixo
    // e a coluna de botoes ocupa a direita, entao a legenda fica em 62% e puxada para a esquerda
    const l = ws.join(' '), y = H * 0.62 + i * 90, cx = W / 2 - 50;
    let px = cx - x.measureText(UP(l)).width / 2;
    x.lineWidth = 14; x.strokeStyle = '#000'; x.lineJoin = 'round';
    x.fillStyle = RX && RX.test(l) ? (CALMO() ? '#ffcf6b' : '#ff3a2a') : '#f4efe6';
    for (const w of ws) {
      if (n++ >= nVis) return;
      const u = UP(w);
      if (FL) { x.lineWidth = 12; x.fillStyle = RXW && RXW.test(w.replace(/[^\p{L}\p{N}]/gu, '')) ? TF().destaque : '#ffffff'; }
      x.strokeText(u, px, y); x.fillText(u, px, y);
      px += x.measureText(u + ' ').width;
    }
  });
}
function sceneAt(t) {
  let i = 0; for (let k = 0; k < ST.cenas.length; k++) if (t >= ST.cenas[k].t0) i = k;
  return i;
}
function drawScene(i, t) {
  const sc = ST.cenas[i], p = sc.p || {}, t1 = i + 1 < ST.cenas.length ? ST.cenas[i + 1].t0 : ST.dur, lt = clamp((t - sc.t0) / Math.max(0.1, t1 - sc.t0));
  E.cena0 = sc.t0;
  const punch = E.pulse(t, 'susto', 0.5), shake = (E.pulse(t, 'golpe', 0.35) + punch) * 16 + (p.temblor || 0);
  const zoom = 1 + (p.zoom ?? 0.06) * lt + 0.18 * punch, fy = (p.fy ?? 0.45) * H;
  x.save();
  x.translate(W / 2 + (rnd(t * 97) - 0.5) * shake, fy + (rnd(t * 71) - 0.5) * shake); x.scale(zoom, zoom); x.translate(-W / 2, -fy);
  (COMP[sc.comp] || COMP.texto)(t, lt, p);
  x.restore();
  if (p.niebla) fog(t, p.niebla, '120,130,150');
  if (FLAT()) {
    // HUD: vale o da cena mais recente que tem "hud" (fica na tela ate outra cena trocar; "hud": false esconde)
    let hh = null; for (let k = i; k >= 0; k--) if (ST.cenas[k].p && ST.cenas[k].p.hud !== undefined) { hh = ST.cenas[k].p.hud; break; }
    hud(hh);
    cartao(p.cartao, lt); if (p.cartao2) cartao(p.cartao2, clamp(lt - 0.25));
  }
}
window.render = function (t) {
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
  const g = ST.gancho;
  if (g && t < g.dur) drawScene(g.cena, g.t); else drawScene(sceneAt(t), t);
  if (g && t < g.dur && t > g.dur - 0.12) { x.fillStyle = '#000'; x.fillRect(0, 0, W, H); }
  for (const e of ST.eventos) if (e.tipo === 'negro' && t >= e.t && t < e.t + (e.dur || 0.4)) { x.fillStyle = '#000'; x.fillRect(0, 0, W, H); }
  const fl = CALMO() || FLAT() ? 0 : Math.max(E.pulse(t, 'susto', 0.14), E.pulse(t, 'flash', 0.14)); if (fl > 0) { x.fillStyle = `rgba(200,30,20,${0.4 * fl})`; x.fillRect(0, 0, W, H); }
  if (ST.eventos.some(e => e.tipo === 'apagon' && t >= e.t && t < e.t + (e.dur || 1.5)) && rnd(Math.floor(t * 16)) > 0.4) { x.fillStyle = 'rgba(0,0,0,0.75)'; x.fillRect(0, 0, W, H); }
  if (FLAT()) { const sf = E.pulse(t, 'susto', 0.18); if (sf > 0) { x.fillStyle = `rgba(255,255,255,${0.35 * sf})`; x.fillRect(0, 0, W, H); } vignette(0.35); }
  else { vignette(CALMO() ? 0.4 : 0.85);
  x.globalAlpha = CALMO() ? 0.035 : 0.08; x.drawImage(grains[Math.floor(t * 24) % 6], 0, 0, W, H); x.globalAlpha = 1; }
  subtitle(t);
  if (t > ST.dur - 0.8) { x.fillStyle = `rgba(0,0,0,${clamp((t - ST.dur + 0.8) / 0.8)})`; x.fillRect(0, 0, W, H); }
};
window.setup = h => {
  ST = h;
  RX = h.destaque && h.destaque.length ? new RegExp(h.destaque.join('|'), 'i') : null;

  const ws = (h.destaque || []).flatMap(d => d.split(/\s+/)).filter(w => w.length > 2).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
