<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Motor de cenas do Hora Muerta. render.py chama setup(historia) e depois render(t) quadro a quadro.
// historia = {segs, cenas, eventos, destaque, gancho, dur}; tempos ja resolvidos em segundos (comum.py).
const W = 1080, H = 1920;
const c = document.getElementById('c'), x = c.getContext('2d');
let ST = { segs: [], cenas: [], eventos: [], destaque: [], gancho: null, dur: 1 };
let RX = null;

function rnd(seed) { const s = Math.sin(seed * 12.9898) * 43758.5453; return s - Math.floor(s); }
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const lerp = (a, b, k) => a + (b - a) * k;
const rng = (v, lt) => Array.isArray(v) ? lerp(v[0], v[1], ease(lt)) : v;

// eventos: E.at(tipo) tempo do 1o evento do tipo na cena (ou Infinity), E.pulse(t, tipo, len) 1 no evento e cai ate 0
const E = {
  list: tipo => ST.eventos.filter(e => e.tipo === tipo),
  at: tipo => { const e = ST.eventos.find(e => e.tipo === tipo && e.t >= E.cena0 - 0.5); return e ? e.t : Infinity; },
  pulse: (t, tipo, len = 0.35) => { let k = 0; for (const e of E.list(tipo)) { const d = t - e.t; if (d >= 0 && d < len) k = Math.max(k, 1 - d / len); } return k; },
  on: (t, tipo) => ST.eventos.some(e => e.tipo === tipo && t >= e.t && t < e.t + (e.dur || 0.5)),
  since: (t, tipo) => { const a = E.at(tipo); return t >= a ? t - a : -1; },
  cena0: 0,
};

const grains = [];
for (let g = 0; g < 6; g++) {
  const gc = document.createElement('canvas'); gc.width = 540; gc.height = 960;
  const gx = gc.getContext('2d'), id = gx.createImageData(540, 960);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); grains.push(gc);
}
function vignette(s) {
  const g = x.createRadialGradient(W / 2, H * 0.45, H * 0.15, W / 2, H / 2, H * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${s})`); x.fillStyle = g; x.fillRect(0, 0, W, H);
}
function fog(t, alpha, tint) {
  for (let i = 0; i < 5; i++) {
    const px = ((t * (18 + i * 7) + i * 300) % (W + 800)) - 400, py = H * (0.35 + i * 0.12) + Math.sin(t * 0.3 + i) * 40;
    const g = x.createRadialGradient(px, py, 0, px, py, 520);
    g.addColorStop(0, `rgba(${tint},${alpha})`); g.addColorStop(1, `rgba(${tint},0)`); x.fillStyle = g; x.fillRect(px - 520, py - 520, 1040, 1040);
  }
}
function glow(cx, cy, r, rgba) {
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, rgba); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(cx - r, cy - r, 2 * r, 2 * r);
}
function flame(cx, cy, t, size = 1) {
  const fl = Math.sin(t * 9) * 0.5 + Math.sin(t * 23) * 0.3 + rnd(Math.floor(t * 12)) * 0.4, fh = (120 + fl * 20) * size, sw = Math.sin(t * 5) * 8 * size;
  const fg = x.createLinearGradient(cx, cy - fh, cx, cy);
  fg.addColorStop(0, 'rgba(255,240,200,0)'); fg.addColorStop(0.3, '#ffe9a8'); fg.addColorStop(0.8, '#ff9a2a'); fg.addColorStop(1, '#3050ff');
  x.fillStyle = fg; x.shadowColor = '#ffb050'; x.shadowBlur = 50 * size;
  x.beginPath(); x.moveTo(cx, cy); x.bezierCurveTo(cx - 36 * size, cy - 30 * size, cx - 18 * size + sw, cy - fh * 0.7, cx + sw, cy - fh);
  x.bezierCurveTo(cx + 18 * size + sw, cy - fh * 0.7, cx + 36 * size, cy - 30 * size, cx, cy); x.fill(); x.shadowBlur = 0;
  return fl;
}
// silhueta humana de pe, base em (0,0), altura ~600 unidades
function figure(px, py, s, col, opts = {}) {
  x.save(); x.translate(px, py); x.scale(s, s); x.fillStyle = col;
  const tall = opts.tall || 1;
  x.beginPath(); x.ellipse(0, -560 * tall, 38, 46, 0, 0, 7); x.fill();
  x.beginPath(); x.moveTo(-30, -515 * tall); x.quadraticCurveTo(-82, -480 * tall, -76, -300 * tall); x.lineTo(-64, 0); x.lineTo(64, 0); x.lineTo(76, -300 * tall); x.quadraticCurveTo(82, -480 * tall, 30, -515 * tall); x.fill();
  const arm = opts.arms || 1;
  x.fillRect(-96, -480 * tall, 20, 260 * arm * tall); x.fillRect(76, -480 * tall, 20, 260 * arm * tall);
  if (opts.hat) { x.beginPath(); x.ellipse(0, -598 * tall, 120, 16, 0, 0, 7); x.fill(); x.fillRect(-48, -680 * tall, 96, 84); }
  if (opts.dress) { x.beginPath(); x.moveTo(-70, -330 * tall); x.lineTo(-150, 0); x.lineTo(150, 0); x.lineTo(70, -330 * tall); x.fill(); }
  if (opts.eyes) {
    x.fillStyle = opts.eyes; x.shadowColor = opts.eyes; x.shadowBlur = 30;
    x.beginPath(); x.arc(-14, -565 * tall, 6, 0, 7); x.arc(14, -565 * tall, 6, 0, 7); x.fill(); x.shadowBlur = 0;
  }
  x.restore();
}
// rosto palido assustador; k = intensidade 0..1; boca 'sonrisa' (sorriso largo) ou 'grito' (boca aberta)
function creepyFace(cx, cy, s, k, skin = 'rgba(205,210,200,', boca = 'sonrisa') {
  if (k <= 0) return;
  x.save(); x.translate(cx, cy); x.scale(s, s); x.rotate(-0.06); x.filter = 'blur(1.2px)';
  const sk = a => skin + (a * k) + ')';
  const g = x.createRadialGradient(-10, -30, 10, 0, 0, 170);
  g.addColorStop(0, sk(0.92)); g.addColorStop(0.65, sk(0.7)); g.addColorStop(1, sk(0.15));
  x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, 100, 152, 0, 0, 7); x.fill();
  for (const ex of [-40, 40]) {
    const eg = x.createRadialGradient(ex, -28, 2, ex, -28, 46);
    eg.addColorStop(0, `rgba(0,0,0,${k})`); eg.addColorStop(0.55, `rgba(0,0,0,${0.9 * k})`); eg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = eg; x.beginPath(); x.ellipse(ex, -28, 46, 38, ex < 0 ? -0.2 : 0.2, 0, 7); x.fill();
  }
  x.filter = 'none';
  x.fillStyle = `rgba(255,255,255,${0.9 * k})`; x.beginPath(); x.arc(-37, -26, 3.2, 0, 7); x.arc(37, -26, 3.2, 0, 7); x.fill();
  x.fillStyle = `rgba(0,0,0,${0.6 * k})`; x.beginPath(); x.ellipse(-9, 30, 5, 8, 0, 0, 7); x.ellipse(9, 30, 5, 8, 0, 0, 7); x.fill();
  if (boca === 'grito') {
    const mg = x.createRadialGradient(0, 95, 4, 0, 95, 60); mg.addColorStop(0, `rgba(0,0,0,${k})`); mg.addColorStop(0.8, `rgba(0,0,0,${0.95 * k})`); mg.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = mg; x.beginPath(); x.ellipse(0, 95, 34, 62, 0, 0, 7); x.fill();
  } else {
    const gw = 92, gy = 78;
    x.fillStyle = `rgba(10,6,6,${0.95 * k})`;
    x.beginPath(); x.moveTo(-gw, gy - 26); x.quadraticCurveTo(0, gy + 62, gw, gy - 26); x.quadraticCurveTo(0, gy + 18, -gw, gy - 26); x.fill();
    x.strokeStyle = `rgba(190,186,165,${0.85 * k})`; x.lineWidth = 2.5;
    for (let i = -7; i <= 7; i++) { const tx = i * gw / 8, kk = 1 - (i * i) / 64; x.beginPath(); x.moveTo(tx, gy - 18 + 26 * kk); x.lineTo(tx + (i % 2) * 2, gy + 4 + 30 * kk); x.stroke(); }
  }
  x.restore();
}
// mao palida aberta (palma + dedos longos), rot em radianos
function hand(cx, cy, s, rot, a, col = '205,205,192') {
  if (a <= 0) return;
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(s, s);
  x.fillStyle = `rgba(${col},${a})`; x.strokeStyle = `rgba(30,30,28,${0.5 * a})`; x.lineWidth = 3;
  x.beginPath(); x.ellipse(0, 40, 62, 72, 0, 0, 7); x.fill(); x.stroke();
  [[-48, -0.35, 120], [-18, -0.12, 150], [14, 0.05, 158], [44, 0.25, 132]].forEach(([fx, fr, fl]) => {
    x.save(); x.translate(fx, -10); x.rotate(fr); x.beginPath(); x.roundRect(-12, -fl, 24, fl + 10, 12); x.fill(); x.stroke();
    x.fillStyle = `rgba(60,55,50,${0.8 * a})`; x.beginPath(); x.ellipse(0, -fl + 10, 8, 11, 0, 0, 7); x.fill(); x.fillStyle = `rgba(${col},${a})`; x.restore();
  });
  x.save(); x.translate(56, 50); x.rotate(1.0); x.beginPath(); x.roundRect(-12, -80, 24, 88, 12); x.fill(); x.stroke(); x.restore();
  x.restore();
}

// ---------------- componentes ----------------
const SEG7 = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function digit(n, ox, oy) {
  const L = 90, T = 16, segs = { a: [0, 0, 1], b: [1, 0, 0], c: [1, 1, 0], d: [0, 2, 1], e: [0, 1, 0], f: [0, 0, 0], g: [0, 1, 1] };
  for (const k of SEG7[n] || '') { const [cx, cy, hor] = segs[k]; if (hor) x.fillRect(ox + T, oy + cy * L - T / 2, L - T, T); else x.fillRect(ox + cx * L - T / 2, oy + cy * L + T, T, L - T * 1.2); }
}
const COMP = {};

COMP.reloj = (t, lt, p) => {
  x.fillStyle = '#050304'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#0d0909'; x.fillRect(120, H * 0.55, W - 240, 700);
  x.fillStyle = '#120c0c'; x.beginPath(); x.roundRect(200, H * 0.40, 680, 300, 40); x.fill();
  const fl = p.parpadeo ?? 0.3, on = 0.85 + 0.15 * Math.sin(t * 40) * fl;
  x.fillStyle = `rgba(255,30,20,${on})`; x.shadowColor = '#ff2010'; x.shadowBlur = 60;
  const hora = (p.hora || '3:33').replace(':', ''), oy = H * 0.40 + 60;
  const xs = hora.length === 3 ? [300, 540, 680] : [250, 390, 600, 740];
  hora.split('').forEach((d, i) => digit(+d, xs[i], oy));
  const cxp = hora.length === 3 ? 470 : 530; x.fillRect(cxp, oy + 50, 22, 22); x.fillRect(cxp, oy + 120, 22, 22);
  x.shadowBlur = 0; glow(W / 2, H * 0.58, 600, 'rgba(160,20,10,0.35)');
};

COMP.vela = (t, lt, p) => {
  x.fillStyle = '#060404'; x.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.52;
  glow(cx, cy - 120, 780, 'rgba(255,170,80,0.42)');
  if (p.foto !== false) {
    x.save(); x.translate(cx + 250, cy - 330); x.rotate(-0.06);
    x.fillStyle = '#2a1c12'; x.fillRect(-150, -200, 300, 380); x.fillStyle = '#3d3226'; x.fillRect(-120, -170, 240, 320);
    x.fillStyle = '#1a140f'; x.beginPath(); x.arc(0, -60, 55, 0, 7); x.fill(); x.fillRect(-80, 0, 160, 150);
    const s = E.since(t, 'foto'); if (s >= 0) creepyFace(0, -55, 0.42, ease(s / 0.4), 'rgba(170,160,140,');
    x.restore();
  }
  x.fillStyle = '#d9cbb0'; x.fillRect(cx - 45, cy, 90, 420); x.fillStyle = '#b5a68b'; x.fillRect(cx - 45, cy, 18, 420);
  if (E.since(t, 'apaga') < 0) flame(cx, cy - 20, t);
  else { const s = E.since(t, 'apaga'); x.fillStyle = `rgba(160,160,160,${0.4 * (1 - clamp(s / 2))})`; for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(cx + Math.sin(t * 2 + i) * 20, cy - 40 - i * 40 - s * 60, 14 + i * 3, 0, 7); x.fill(); } }
};

COMP.pasillo = (t, lt, p) => {
  x.fillStyle = '#030305'; x.fillRect(0, 0, W, H);
  const vx = W / 2, vy = H * 0.47, fw = 170, fh = 330;
  const fl = 1 - (p.parpadeo ?? 0.3) * (rnd(Math.floor(t * 14)) > 0.7 ? 0.75 : 0);
  glow(vx, vy, 520, `rgba(170,190,200,${0.55 * fl})`);
  x.fillStyle = `rgba(150,170,180,${0.5 * fl})`; x.fillRect(vx - fw / 2, vy - fh / 2, fw, fh);
  x.fillStyle = '#1c1e24';
  x.beginPath(); x.moveTo(0, 0); x.lineTo(vx - fw / 2, vy - fh / 2); x.lineTo(vx - fw / 2, vy + fh / 2); x.lineTo(0, H); x.fill();
  x.beginPath(); x.moveTo(W, 0); x.lineTo(vx + fw / 2, vy - fh / 2); x.lineTo(vx + fw / 2, vy + fh / 2); x.lineTo(W, H); x.fill();
  x.fillStyle = '#0b0b0e'; x.beginPath(); x.moveTo(0, H); x.lineTo(vx - fw / 2, vy + fh / 2); x.lineTo(vx + fw / 2, vy + fh / 2); x.lineTo(W, H); x.fill();
  x.fillStyle = '#08080a'; x.beginPath(); x.moveTo(0, 0); x.lineTo(vx - fw / 2, vy - fh / 2); x.lineTo(vx + fw / 2, vy - fh / 2); x.lineTo(W, 0); x.fill();
  for (let i = 0; i < 3; i++) {
    const k = 0.25 + i * 0.22, lx = (vx - fw / 2) * k, top = vy - fh / 2 - (vy - fh / 2) * (1 - k) + 60 * (1 - k), bot = vy + fh / 2 + (H - vy - fh / 2) * (1 - k);
    x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 10 * (1 - k) + 2; x.strokeRect(lx - 40 * (1 - k), top + (bot - top) * 0.15, 60 * (1 - k) + 10, (bot - top) * 0.8);
  }
  if (p.figura !== false) {
    let dist = rng(p.dist ?? [1, 0.6], lt); const a = E.since(t, 'acerca'); if (a >= 0) dist = Math.max(0, dist - ease(a / 0.25) * 0.5);
    const sc = (0.35 + (1 - dist) * 1.6) * 0.55, sy = vy + fh / 2 - 10 + (1 - dist) * 380;
    figure(vx + Math.sin(t * 0.7) * 3, sy, sc, 'rgba(0,0,0,0.93)', { tall: 1.1, arms: 1.5, eyes: E.since(t, 'susto') >= 0 ? 'rgba(255,240,230,0.9)' : null });
  }
  if (p.marco !== false) { x.fillStyle = '#020203'; x.fillRect(0, 0, 150, H); x.fillRect(W - 150, 0, 150, H); x.fillRect(0, 0, W, 120); }
};

COMP.telefono = (t, lt, p) => {
  x.fillStyle = '#030306'; x.fillRect(0, 0, W, H);
  const buzz = E.on(t, 'vibra'), sh = buzz ? (rnd(t * 60) - 0.5) * 16 : 0, cx = W / 2 + sh, cy = H * 0.5;
  glow(cx, cy, 900, 'rgba(90,120,200,0.30)');
  x.save(); x.translate(cx, cy); x.rotate(-0.08 + lt * 0.02);
  x.fillStyle = '#111'; x.beginPath(); x.roundRect(-250, -500, 500, 1000, 60); x.fill();
  x.fillStyle = '#0d1424'; x.beginPath(); x.roundRect(-230, -480, 460, 960, 48); x.fill();
  x.fillStyle = '#c9d4ea'; x.font = '200 130px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText(p.hora || '3:33', 0, -270);
  const m = E.since(t, 'mensaje');
  if (m >= 0 && p.msg) {
    x.globalAlpha = ease(m / 0.5);
    const lines = p.msg, hh = 110 + lines.length * 46;
    x.fillStyle = 'rgba(230,236,250,0.93)'; x.beginPath(); x.roundRect(-210, -150, 420, hh, 30); x.fill();
    x.fillStyle = '#1b2540'; x.textAlign = 'left'; x.font = '700 40px system-ui, sans-serif'; x.fillText(p.de || 'Mamá', -180, -90);
    x.font = '400 32px system-ui, sans-serif'; lines.forEach((l, i) => x.fillText(l, -180, -30 + i * 46)); x.globalAlpha = 1;
  }
  x.restore();
};

const MX = W / 2, MY = H * 0.43, MW = 640, MH = 900;
function mframe() {
  x.fillStyle = '#2b2118'; x.beginPath(); x.roundRect(MX - MW / 2 - 40, MY - MH / 2 - 40, MW + 80, MH + 80, 30); x.fill();
  x.strokeStyle = '#4a3a2a'; x.lineWidth = 6; x.beginPath(); x.roundRect(MX - MW / 2 - 22, MY - MH / 2 - 22, MW + 44, MH + 44, 22); x.stroke();
}
function tiles(light, tint = '150,170,150') {
  x.fillStyle = '#0b0d0c'; x.fillRect(0, 0, W, H);
  glow(MX, MY - 500, 1300, `rgba(${tint},${0.22 * light})`);
  x.strokeStyle = 'rgba(255,255,255,0.035)'; x.lineWidth = 2;
  for (let yy = 0; yy < H; yy += 120) { x.beginPath(); x.moveTo(0, yy); x.lineTo(W, yy); x.stroke(); }
  for (let xx = 0; xx < W; xx += 120) { x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx, H); x.stroke(); }
}
COMP.tela = (t, lt, p) => {
  tiles(0.8); mframe();
  const top = MY - MH / 2 - 60, bot = MY + MH / 2 + 90;
  const g = x.createLinearGradient(MX - MW / 2, 0, MX + MW / 2, 0);
  g.addColorStop(0, '#8d8a82'); g.addColorStop(0.5, '#c9c4b8'); g.addColorStop(1, '#7e7b73'); x.fillStyle = g;
  x.beginPath(); x.moveTo(MX - MW / 2 - 70, top); x.lineTo(MX + MW / 2 + 70, top); x.quadraticCurveTo(MX + MW / 2 + 90, MY, MX + MW / 2 + 60, bot);
  for (let i = 6; i >= 0; i--) { const px = MX - MW / 2 - 60 + (MW + 120) * i / 6; x.lineTo(px, bot + (i % 2 ? 26 : 0) + Math.sin(t * 1.5 + i) * 4); }
  x.quadraticCurveTo(MX - MW / 2 - 90, MY, MX - MW / 2 - 70, top); x.fill();
  for (let i = 0; i < 7; i++) {
    const fx = MX - MW / 2 + 40 + i * (MW - 80) / 6 + Math.sin(t * 0.8 + i) * 4, fg = x.createLinearGradient(fx - 30, 0, fx + 30, 0);
    fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(0.5, 'rgba(0,0,0,0.16)'); fg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = fg; x.fillRect(fx - 30, top, 60, bot - top);
  }
  const bulge = Math.max(rng(p.mano ?? 0, lt), E.pulse(t, 'golpe', 0.45));
  if (bulge > 0.01) {
    const s = 0.9 + bulge * 0.25; x.save(); x.translate(MX + 30, MY - 40); x.scale(s, s);
    for (const [sx, sy, rx, ry] of [[0, 60, 95, 115], [-72, -80, 24, 70], [-26, -110, 25, 82], [22, -105, 25, 80], [66, -70, 22, 64], [-110, 60, 22, 55]]) {
      const hg = x.createRadialGradient(sx - rx * 0.35, sy - ry * 0.35, 2, sx, sy, Math.max(rx, ry) * 1.3);
      hg.addColorStop(0, `rgba(255,252,240,${0.55 * bulge})`); hg.addColorStop(0.6, `rgba(120,115,105,${0.25 * bulge})`); hg.addColorStop(1, `rgba(20,18,15,${0.5 * bulge})`);
      x.fillStyle = hg; x.beginPath(); x.ellipse(sx, sy, rx, ry, 0, 0, 7); x.fill();
    }
    x.restore();
  }
  const r = E.since(t, 'revela');
  if (r >= 0) {
    const L = ease(r / 0.6), cx = MX + MW / 2 + 60, cy = bot;
    x.fillStyle = '#050707'; x.beginPath(); x.moveTo(cx, cy - 520 * L); x.lineTo(cx, cy); x.lineTo(cx - 420 * L, cy); x.closePath(); x.fill();
    if (L > 0.6) {
      x.fillStyle = 'rgba(235,240,230,0.95)'; x.shadowColor = '#e8ffe8'; x.shadowBlur = 25;
      x.beginPath(); x.ellipse(cx - 90, cy - 260 * L, 16, 9, 0, 0, 7); x.fill();
      x.lineWidth = 8; x.strokeStyle = 'rgba(235,240,230,0.9)'; x.beginPath(); x.arc(cx - 110, cy - 220 * L, 70, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke(); x.shadowBlur = 0;
    }
  }
};
COMP.tres_espejos = (t, lt, p) => {
  x.fillStyle = '#070505'; x.fillRect(0, 0, W, H); glow(W / 2, H * 0.62, 900, 'rgba(230,150,70,0.3)');
  const d = E.since(t, 'descubre'), uncover = d >= 0 ? d / 1.6 : 0;
  for (let i = 0; i < 3; i++) {
    const cx = 210 + i * 330, cy = H * 0.4 + (i === 1 ? -60 : 0), w = 230, h = 340;
    x.fillStyle = '#26190f'; x.fillRect(cx - w / 2 - 18, cy - h / 2 - 18, w + 36, h + 36); x.fillStyle = '#0c100f'; x.fillRect(cx - w / 2, cy - h / 2, w, h);
    const u = ease(uncover - i * 0.15); x.fillStyle = 'rgba(190,182,166,0.95)'; x.fillRect(cx - w / 2 - 25, cy - h / 2 - 30 + u * (h + 80), w + 50, (h + 80) * (1 - u));
  }
  x.fillStyle = '#d9cbb0'; x.fillRect(W / 2 - 35, H * 0.7, 70, 330); flame(W / 2, H * 0.7 - 5, t, 0.8);
};
function headShape(px, py, s, col) {
  x.fillStyle = col; x.save(); x.translate(px, py); x.scale(s, s);
  x.beginPath(); x.ellipse(0, -150, 110, 135, 0, 0, 7); x.fill();
  x.beginPath(); x.moveTo(-70, -40); x.quadraticCurveTo(-260, 0, -300, 260); x.lineTo(300, 260); x.quadraticCurveTo(260, 0, 70, -40); x.fill(); x.restore();
}
COMP.bano = (t, lt, p) => {
  const sm = E.since(t, 'sonrisa'), light = sm >= 0 && rnd(Math.floor(t * 20)) > 0.55 ? 0.3 : 1;
  tiles(light); mframe();
  const gg = x.createLinearGradient(MX - MW / 2, MY - MH / 2, MX + MW / 2, MY + MH / 2);
  gg.addColorStop(0, '#1c2421'); gg.addColorStop(0.5, '#101614'); gg.addColorStop(1, '#0a0e0d'); x.fillStyle = gg; x.fillRect(MX - MW / 2, MY - MH / 2, MW, MH);
  x.save(); x.beginPath(); x.rect(MX - MW / 2, MY - MH / 2, MW, MH); x.clip();
  const lv = E.at('levanta'), rf = Math.min(E.at('reflejo'), lv + (p.atraso ?? 1.2));
  const ry = MY + 150 + (1 - ease((t - rf) / 0.9)) * 360;
  headShape(MX, ry, 1, 'rgb(30,36,33)');
  if (t > rf) { const e = clamp((t - rf - 0.8) / 0.6); x.fillStyle = `rgba(200,215,205,${0.25 + e * 0.5})`; x.beginPath(); x.ellipse(MX - 42, ry - 165, 12, 6, 0, 0, 7); x.ellipse(MX + 42, ry - 165, 12, 6, 0, 0, 7); x.fill(); }
  if (sm >= 0) {
    const k = ease(sm / 0.35);
    x.fillStyle = `rgba(0,0,0,${0.9 * k})`; x.beginPath(); x.ellipse(MX - 44, ry - 168, 30, 20 + k * 6, -0.15, 0, 7); x.ellipse(MX + 44, ry - 168, 30, 20 + k * 6, 0.15, 0, 7); x.fill();
    x.fillStyle = `rgba(255,255,255,${k})`; x.shadowColor = '#fff'; x.shadowBlur = 18; x.beginPath(); x.arc(MX - 40, ry - 166, 4, 0, 7); x.arc(MX + 40, ry - 166, 4, 0, 7); x.fill();
    const gw = 95 + k * 45, gy = ry - 100; x.fillStyle = `rgba(225,222,205,${k})`;
    x.beginPath(); x.moveTo(MX - gw, gy - 18); x.quadraticCurveTo(MX, gy + 70, MX + gw, gy - 18); x.quadraticCurveTo(MX, gy + 22, MX - gw, gy - 18); x.fill();
    x.shadowBlur = 0; x.strokeStyle = `rgba(20,20,18,${0.8 * k})`; x.lineWidth = 3;
    for (let i = -6; i <= 6; i++) { const tx = MX + i * gw / 7, kk = 1 - (i * i) / 49; x.beginPath(); x.moveTo(tx, gy - 10 + 26 * kk); x.lineTo(tx, gy + 12 + 34 * kk); x.stroke(); }
  }
  // vidro rachando a partir do ponto do golpe (evento 'raja'; dois eventos = duas rachaduras)
  E.list('raja').forEach((ev, n) => {
    const d = t - ev.t; if (d < 0) return;
    const k = ease(d / 0.15), ox = MX + 60 - n * 120, oy = MY - 120 + n * 90;
    x.strokeStyle = 'rgba(220,235,230,0.75)'; x.lineWidth = 2.5;
    for (let r = 0; r < 11; r++) {
      let a = r / 11 * Math.PI * 2 + rnd(r + n * 7) * 0.4, px = ox, py = oy; x.beginPath(); x.moveTo(px, py);
      for (let sgm = 0; sgm < 5; sgm++) { const L = (40 + rnd(r * 5 + sgm + n) * 70) * k; a += (rnd(r + sgm * 3 + n) - 0.5) * 0.6; px += Math.cos(a) * L; py += Math.sin(a) * L; x.lineTo(px, py); }
      x.stroke();
    }
    x.fillStyle = 'rgba(230,240,235,0.6)'; x.beginPath(); x.arc(ox, oy, 10 * k, 0, 7); x.fill();
  });
  x.restore();
  x.fillStyle = '#1a1d1c'; x.fillRect(MX - 420, MY + MH / 2 + 110, 840, 70);
  headShape(MX, H + 120 - ease((t - lv) / 0.7) * 260, 1.9, '#030404');
};

// estrada de terra a noite, lua, arvores; figura alta de chapeu (Silbon) se aproximando
COMP.camino = (t, lt, p) => {
  const sky = x.createLinearGradient(0, 0, 0, H * 0.55); sky.addColorStop(0, '#05070d'); sky.addColorStop(1, '#141a24'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  glow(W * 0.72, H * 0.16, 380, 'rgba(200,215,235,0.25)'); x.fillStyle = '#d8dde6'; x.beginPath(); x.arc(W * 0.72, H * 0.16, 70, 0, 7); x.fill();
  const hz = H * 0.52; x.fillStyle = '#07080a'; x.fillRect(0, hz, W, H - hz);
  x.fillStyle = '#16140f'; x.beginPath(); x.moveTo(W / 2 - 30, hz); x.lineTo(W / 2 + 30, hz); x.lineTo(W + 200, H); x.lineTo(-200, H); x.fill();
  for (let i = 0; i < 9; i++) {
    const side = i % 2 ? 1 : -1, k = (i + 1) / 10, tx = W / 2 + side * (80 + k * 700), base = hz + k * k * (H - hz) * 0.9, th = 260 + k * 900;
    x.fillStyle = '#020203'; x.fillRect(tx - 8 - k * 20, base - th, 16 + k * 40, th);
    x.beginPath(); x.ellipse(tx, base - th, 90 + k * 260, 60 + k * 160, 0, 0, 7); x.fill();
  }
  fog(t, 0.08, '120,130,150');
  if (p.figura === false) return;
  let dist = rng(p.dist ?? [1, 0.5], lt); const a = E.since(t, 'acerca'); if (a >= 0) dist = Math.max(0, dist - ease(a / 0.3) * 0.45);
  const sc = 0.12 + (1 - dist) * 1.1, fy = hz + 6 + (1 - dist) * (H - hz) * 0.75, bob = Math.sin(t * 3.2) * 6 * sc;
  figure(W / 2 + Math.sin(t * 0.5) * 10, fy + bob, sc, '#000', { tall: 1.35, arms: 1.7, hat: p.sombrero !== false, eyes: E.since(t, 'susto') >= 0 || p.ojos ? 'rgba(255,60,40,0.95)' : null });
};

// interior de onibus a noite: fileiras de bancos em perspectiva, janelas com luzes passando, passageiro
COMP.autobus = (t, lt, p) => {
  x.fillStyle = '#050609'; x.fillRect(0, 0, W, H);
  const vx = W / 2, vy = H * 0.40, fl = rnd(Math.floor(t * 8)) > 0.88 ? 0.55 : 1;
  const P = z => ({ s: 1 / z, y: vy + (H * 1.02 - vy) / z, top: vy - (vy - 60) / z });
  // teto e luz do corredor
  x.fillStyle = '#0b0c10'; x.beginPath(); x.moveTo(0, 0); x.lineTo(W, 0); x.lineTo(vx + 120, vy - 140); x.lineTo(vx - 120, vy - 140); x.fill();
  for (let r = 1; r < 8; r++) { const q = P(r * 0.9 + 0.4); x.fillStyle = `rgba(190,210,255,${0.22 * fl * q.s})`; x.fillRect(vx - 60 * q.s, q.top + 20 * q.s, 120 * q.s, 14 * q.s); }
  // janelas laterais com luzes da rua passando
  for (const side of [-1, 1]) for (let r = 0; r < 7; r++) {
    const a = P(r * 0.9 + 0.6), b = P(r * 0.9 + 1.3), xa = vx + side * 560 * a.s, xb = vx + side * 560 * b.s;
    const lit = Math.max(0, Math.sin(t * 3 - r * 0.9 + side)) ** 6;
    x.fillStyle = `rgba(${30 + lit * 150},${36 + lit * 110},${55 + lit * 60},0.9)`;
    x.beginPath(); x.moveTo(xa, a.top + 150 * a.s); x.lineTo(xb, b.top + 150 * b.s); x.lineTo(xb, b.top + 520 * b.s); x.lineTo(xa, a.top + 520 * a.s); x.fill();
  }
  // piso do corredor
  x.fillStyle = '#0d0e12'; x.beginPath(); x.moveTo(vx - 70, vy + 60); x.lineTo(vx + 70, vy + 60); x.lineTo(vx + 300, H); x.lineTo(vx - 300, H); x.fill();
  const seat = (r, side) => {
    const q = P(r * 0.9 + 1), w = 360 * q.s, h = 640 * q.s, sx = vx + side * (90 + 230) * q.s * 1.15;
    x.fillStyle = '#1c1416'; x.beginPath(); x.roundRect(sx - w / 2, q.y - h, w, h, 34 * q.s); x.fill();
    x.fillStyle = '#2a1e21'; x.beginPath(); x.roundRect(sx - w / 2 + 10 * q.s, q.y - h + 8 * q.s, w - 20 * q.s, 90 * q.s, 26 * q.s); x.fill();
    x.fillStyle = '#6c6f78'; x.fillRect(sx - w / 2, q.y - h - 12 * q.s, w, 10 * q.s);
    return { sx, q, w, h };
  };
  const fundo = 6, ap = E.since(t, 'aparece'), vol = E.since(t, 'voltea');
  for (let r = fundo; r >= 0; r--) {
    for (const side of [-1, 1]) {
      const st = seat(r, side);
      // passageiro do fundo (sentado, so cabeca e ombros acima do encosto)
      if (r === fundo - 1 && side === (p.lado ?? 1) && p.figura) {
        x.save(); x.beginPath(); x.rect(0, 0, W, st.q.y - st.h * 0.75); x.clip();
        figure(st.sx, st.q.y - st.h * 0.2, st.q.s * 0.9, '#000', { eyes: 'rgba(255,240,220,0.9)' }); x.restore();
      }
    }
  }
  // o que se senta ao seu lado: surge enorme no banco da frente, encarando
  if (ap >= 0) {
    const k = ease(ap / 0.2), sx = vx - 300, sy = H * 0.62;
    headShape(sx, sy + 120, 1.5, `rgba(0,0,0,${0.97 * k})`);
    creepyFace(sx + 10, sy - 110, 1.15, vol >= 0 ? 1 : k * 0.75);
  }
  x.fillStyle = `rgba(255,255,255,${0.03 * fl})`; x.fillRect(0, 0, W, H);
};

// mata escura com pares de olhos vermelhos (Cadejo)
// cachorro de frente (Cadejo): cabeca canina com orelhas em pe, focinho, ombros; contraluz para o negro aparecer no escuro
function dogPath() {
  x.beginPath(); x.moveTo(0, -92);
  x.quadraticCurveTo(38, -96, 56, -78); x.lineTo(96, -188); x.quadraticCurveTo(124, -96, 110, -28);
  x.quadraticCurveTo(116, 30, 72, 72); x.quadraticCurveTo(54, 142, 26, 156); x.quadraticCurveTo(0, 166, -26, 156);
  x.quadraticCurveTo(-54, 142, -72, 72); x.quadraticCurveTo(-116, 30, -110, -28); x.quadraticCurveTo(-124, -96, -96, -188);
  x.lineTo(-56, -78); x.quadraticCurveTo(-38, -96, 0, -92); x.closePath();
}
function dog(ex, ey, s, t, blanco) {
  x.save(); x.translate(ex, ey); x.scale(s, s);
  const g = x.createRadialGradient(0, -20, 40, 0, -20, 420);
  g.addColorStop(0, blanco ? 'rgba(150,190,255,0.32)' : 'rgba(120,130,150,0.30)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(-460, -460, 920, 920);
  const pelo = blanco ? 'rgba(232,238,246,0.92)' : 'rgba(7,7,8,1)', borda = blanco ? 'rgba(190,215,255,0.9)' : 'rgba(150,160,180,0.55)';
  // ombros e peito
  // o corpo some no escuro para baixo (degrade), so a cabeca fica nitida
  const cg = x.createLinearGradient(0, 60, 0, 460); cg.addColorStop(0, pelo); cg.addColorStop(0.55, blanco ? 'rgba(200,215,235,0.35)' : 'rgba(7,7,8,0.9)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = cg; x.beginPath(); x.moveTo(-84, 60); x.quadraticCurveTo(-210, 170, -300, 460); x.lineTo(300, 460); x.quadraticCurveTo(210, 170, 84, 60); x.fill();
  const sg = x.createLinearGradient(0, 60, 0, 420); sg.addColorStop(0, borda); sg.addColorStop(1, 'rgba(0,0,0,0)');
  x.strokeStyle = sg; x.lineWidth = 3; x.beginPath(); x.moveTo(-84, 60); x.quadraticCurveTo(-210, 170, -300, 460); x.moveTo(84, 60); x.quadraticCurveTo(210, 170, 300, 460); x.stroke();
  // tufos de pelo curtos nas bochechas (juba)
  for (let f = 0; f < 12; f++) {
    const sd = f % 2 ? 1 : -1, k = (f >> 1) / 6, bx = sd * (96 + k * 70), by = 10 + k * 120, L = 16 + rnd(f + 3) * 14;
    x.fillStyle = pelo; x.beginPath(); x.moveTo(bx - sd * 24, by - 16); x.lineTo(bx + sd * L, by + 4); x.lineTo(bx - sd * 24, by + 18); x.fill();
    x.strokeStyle = borda; x.lineWidth = 2; x.beginPath(); x.moveTo(bx - sd * 4, by - 8); x.lineTo(bx + sd * L, by + 4); x.stroke();
  }
  if (blanco) { x.shadowColor = 'rgba(170,205,255,0.9)'; x.shadowBlur = 60; }
  x.fillStyle = pelo; dogPath(); x.fill(); x.shadowBlur = 0;
  x.strokeStyle = borda; x.lineWidth = 3.5; dogPath(); x.stroke();
  // dentro das orelhas, ponte do focinho, sobrancelhas
  x.fillStyle = blanco ? 'rgba(200,170,175,0.5)' : 'rgba(40,14,12,0.9)';
  for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(sd * 64, -86); x.lineTo(sd * 92, -160); x.lineTo(sd * 102, -60); x.fill(); }
  x.strokeStyle = blanco ? 'rgba(150,165,190,0.5)' : 'rgba(110,118,135,0.35)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(-14, -40); x.quadraticCurveTo(-10, 60, -18, 118); x.moveTo(14, -40); x.quadraticCurveTo(10, 60, 18, 118); x.stroke();
  x.lineWidth = 5; x.beginPath(); x.moveTo(-82, -30); x.quadraticCurveTo(-50, -44, -22, -22); x.moveTo(82, -30); x.quadraticCurveTo(50, -44, 22, -22); x.stroke();
  // nariz brilhante
  x.fillStyle = blanco ? 'rgba(35,35,42,0.95)' : 'rgba(18,6,5,1)'; x.beginPath(); x.ellipse(0, 128, 26, 17, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(220,225,235,0.45)'; x.beginPath(); x.ellipse(-8, 121, 8, 4, -0.3, 0, 7); x.fill();
  if (!blanco) {
    // presas e bafo quente subindo
    x.fillStyle = 'rgba(225,215,195,0.95)';
    for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(sd * 16, 150); x.lineTo(sd * 22, 192); x.lineTo(sd * 30, 148); x.fill(); }
    for (let b = 0; b < 5; b++) {
      const ph = (t * 0.6 + b / 5) % 1, bx = Math.sin(b * 2 + t) * 30, by = 150 + ph * 110, r = 30 + ph * 80;
      const bg = x.createRadialGradient(bx, by, 0, bx, by, r); bg.addColorStop(0, `rgba(190,195,205,${0.09 * Math.sin(Math.PI * ph)})`); bg.addColorStop(1, 'rgba(190,195,205,0)');
      x.fillStyle = bg; x.beginPath(); x.arc(bx, by, r, 0, 7); x.fill();
    }
  }
  x.restore();
}

COMP.ojos = (t, lt, p) => {
  x.fillStyle = '#020303'; x.fillRect(0, 0, W, H); glow(W / 2, H * 0.3, 900, 'rgba(60,80,90,0.18)');
  for (let i = 0; i < 14; i++) { const tx = rnd(i + 3) * W, w = 30 + rnd(i + 9) * 90; x.fillStyle = i % 3 ? '#050707' : '#080a0a'; x.fillRect(tx - w / 2, 0, w, H); }
  x.fillStyle = '#030404'; x.fillRect(0, H * 0.72, W, H * 0.28);
  const n = p.n ?? 1, ac = E.since(t, 'acerca'), near = Math.max(rng(p.cerca ?? [0, 0.3], lt), ac >= 0 ? ease(ac / 0.35) : 0);
  for (let i = 0; i < n; i++) {
    const ex = W * (n === 1 ? 0.5 : 0.25 + 0.5 * i / Math.max(1, n - 1)) + Math.sin(t * 0.6 + i) * 20, ey = H * (0.55 - near * 0.05) + i * 30;
    const s = lerp(0.6, 3.2, near) * (1 - i * 0.15), blink = rnd(Math.floor(t * 3 + i * 7)) > 0.93 ? 0.1 : 1;
    if (p.perro && i === 0 && near > 0.4) dog(ex, ey, s, t, !!p.blanco);
    const col = p.color || '255,40,20'; x.fillStyle = `rgba(${col},${0.95 * blink})`; x.shadowColor = `rgb(${col})`; x.shadowBlur = 40 * s;
    x.beginPath(); x.ellipse(ex - 46 * s, ey, 13 * s, 8 * s * blink, 0.2, 0, 7); x.ellipse(ex + 46 * s, ey, 13 * s, 8 * s * blink, -0.2, 0, 7); x.fill(); x.shadowBlur = 0;
  }
  fog(t, 0.06, '90,100,110');
};

// janela vista de dentro do quarto escuro; rosto aparece no vidro
COMP.ventana = (t, lt, p) => {
  x.fillStyle = '#040405'; x.fillRect(0, 0, W, H);
  const wx = W / 2, wy = H * 0.42, ww = 620, wh = 860;
  const out = x.createLinearGradient(0, wy - wh / 2, 0, wy + wh / 2); out.addColorStop(0, '#0d1420'); out.addColorStop(1, '#1b2433');
  x.fillStyle = out; x.fillRect(wx - ww / 2, wy - wh / 2, ww, wh);
  glow(wx + 140, wy - 250, 260, 'rgba(210,225,245,0.35)');
  for (let i = 0; i < 5; i++) { x.fillStyle = '#05070b'; const bx = wx - ww / 2 + i * 150, bh = 120 + rnd(i) * 200; x.fillRect(bx, wy + wh / 2 - bh, 110, bh); }
  const c0 = E.since(t, 'cara');
  if (c0 >= 0 || p.cara) {
    const k = c0 >= 0 ? ease(c0 / 0.2) : 1;
    creepyFace(wx - 40, wy + 40, lerp(0.6, 1.35, k), k);
    hand(wx - 290, wy - 60, 1.1, -0.25, 0.85 * k); hand(wx + 210, wy - 90, 1.1, 0.3, 0.85 * k);
  }
  x.strokeStyle = '#120e0b'; x.lineWidth = 34; x.strokeRect(wx - ww / 2, wy - wh / 2, ww, wh);
  x.beginPath(); x.moveTo(wx, wy - wh / 2); x.lineTo(wx, wy + wh / 2); x.moveTo(wx - ww / 2, wy); x.lineTo(wx + ww / 2, wy); x.lineWidth = 18; x.stroke();
  const sway = Math.sin(t * 0.9) * 14;
  for (const s of [-1, 1]) {
    x.fillStyle = '#160d0f'; x.beginPath(); const ex = wx + s * (ww / 2 + 120);
    x.moveTo(ex, 0); x.lineTo(wx + s * (ww / 2 - 90) + sway, 0); x.quadraticCurveTo(wx + s * (ww / 2 - 40) + sway * 2, wy, wx + s * (ww / 2 - 110) + sway, H * 0.8); x.lineTo(ex, H * 0.8); x.fill();
  }
  x.fillStyle = '#060506'; x.fillRect(0, H * 0.8, W, H * 0.2);
};

// rio ao luar, juncos, mulher de branco na margem (Llorona)
COMP.rio = (t, lt, p) => {
  const sky = x.createLinearGradient(0, 0, 0, H * 0.45); sky.addColorStop(0, '#04060a'); sky.addColorStop(1, '#101824'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  x.fillStyle = '#d5dbe4'; x.beginPath(); x.arc(W * 0.3, H * 0.13, 60, 0, 7); x.fill(); glow(W * 0.3, H * 0.13, 340, 'rgba(200,215,235,0.22)');
  const hz = H * 0.45; x.fillStyle = '#05070a'; x.fillRect(0, hz - 40, W, 60);
  const wg = x.createLinearGradient(0, hz, 0, H); wg.addColorStop(0, '#0d1520'); wg.addColorStop(1, '#03050a'); x.fillStyle = wg; x.fillRect(0, hz, W, H - hz);
  for (let i = 0; i < 26; i++) { const yy = hz + 20 + i * i * 2.2, w = 40 + i * 9; x.fillStyle = `rgba(200,215,235,${0.18 - i * 0.005})`; x.fillRect(W * 0.3 - w / 2 + Math.sin(t * 2 + i) * (6 + i), yy, w, 3 + i * 0.2); }
  let dist = rng(p.dist ?? [1, 0.7], lt); const g = E.since(t, 'grito'); if (g >= 0) dist = Math.max(0, dist - ease(g / 0.25) * 0.6);
  const sc = 0.1 + (1 - dist) * 1.0, fx = W * 0.66 - (1 - dist) * 150, fy = hz + 10 + (1 - dist) * 900;
  const fade = 0.55 + 0.25 * Math.sin(t * 1.3);
  figure(fx, fy, sc, `rgba(225,230,235,${fade})`, { dress: true, tall: 1.05 });
  x.fillStyle = `rgba(10,10,14,${fade})`; x.save(); x.translate(fx, fy); x.scale(sc, sc); x.beginPath(); x.ellipse(0, -545, 52, 80, 0, 0, 7); x.fill(); x.fillRect(-52, -545, 104, 200); x.restore();
  if (g >= 0) creepyFace(fx, fy - 560 * sc, sc * 0.4, ease(g / 0.3), 'rgba(225,230,235,', 'grito');
  for (let i = 0; i < 18; i++) { const rx = (i / 17) * W + rnd(i) * 30, rh = 220 + rnd(i + 5) * 320, sw = Math.sin(t * 1.2 + i) * 18; x.strokeStyle = '#010202'; x.lineWidth = 9; x.beginPath(); x.moveTo(rx, H); x.quadraticCurveTo(rx + sw / 2, H - rh / 2, rx + sw, H - rh); x.stroke(); }
  fog(t, 0.07, '140,150,170');
};

// manglar do Pacifico a noite: arvores sobre raizes em arco, agua parada, mulher de vestido florido com agua ate os joelhos
// p.figura false sem mulher; p.dist [ini, fim]; evento 'voltea' (ela vira com o rosto da mae, sorrindo); 'acerca'
function rootsTree(rx, base, s, col, copa = true) {
  x.strokeStyle = col; x.fillStyle = col; x.lineCap = 'round';
  x.lineWidth = 34 * s; x.beginPath(); x.moveTo(rx, base - 260 * s); x.lineTo(rx + 10 * s, base - 1100 * s); x.stroke();
  for (let k = 0; k < 7; k++) {
    const sx = rx + (k - 3) * 120 * s + rnd(rx + k) * 40 * s, h = (160 + rnd(k + rx) * 120) * s;
    x.lineWidth = (9 + rnd(k * 3 + rx) * 6) * s; x.beginPath(); x.moveTo(rx, base - 300 * s);
    x.quadraticCurveTo(lerp(rx, sx, 0.75), base - h - 140 * s, sx, base); x.stroke();
  }
  for (let k = 0; copa && k < 6; k++) {

  x.fillStyle = g; x.fillRect(0, 0, W, H);

  x.fillStyle = tarde ? '#4a3524' : '#7a5f41'; x.beginPath(); x.moveTo(0, H); x.lineTo(vx - 60, vy); x.lineTo(vx + 60, vy); x.lineTo(W, H); x.fill();
  x.fillStyle = 'rgba(60,40,25,0.35)'; for (let i = 0; i < 18; i++) { const k = rnd(i * 5.3), y = vy + (H - vy) * Math.pow(rnd(i * 2.1), 0.7); x.beginPath(); x.ellipse(vx + (k - 0.5) * (y - vy) * 1.6, y, 30 + (y - vy) * 0.08, 8 + (y - vy) * 0.02, 0, 0, 7); x.fill(); }
  if (p.portao) {
    x.fillStyle = tarde ? '#5a5260' : '#9a9286'; x.fillRect(vx - 230, vy - 260, 460, 300);
    for (let m = 0; m < 8; m++) x.fillRect(vx - 230 + m * 60, vy - 290, 34, 32);
    x.fillStyle = tarde ? '#f4b06a' : '#d9ead9'; x.beginPath(); x.moveTo(vx - 80, vy + 40); x.lineTo(vx - 80, vy - 120); x.quadraticCurveTo(vx, vy - 210, vx + 80, vy - 120); x.lineTo(vx + 80, vy + 40); x.fill();
  }

    const xa = vx + lado * (70 + d0 * (W / 2 + 120)), xb = vx + lado * (70 + d1 * (W / 2 + 120));

    x.fillStyle = cores[(k + (lado > 0 ? 1 : 0)) % 4];

    x.strokeStyle = '#4b3220'; x.lineWidth = 4 + d1 * 10;
    x.beginPath(); x.moveTo(xa, top0); x.lineTo(xb, top1); x.lineTo(xb, bot1); x.moveTo(xa, (top0 + bot0) / 2); x.lineTo(xb, (top1 + bot1) / 2); x.moveTo(xa, top0); x.lineTo(xb, (top1 + bot1) / 2); x.stroke();
    x.fillStyle = '#7a4f2c'; x.beginPath(); x.moveTo(xa, top0); x.lineTo(xb, top1); x.lineTo(xb, top1 - 60 - d1 * 120); x.lineTo(xa, top0 - 40 - d0 * 120); x.fill();
    // toldo colorido da banca

// Elevador: cabine escura por dentro, portas de metal fechadas no meio, luz de emergencia
// piscando, fresta acesa embaixo. Parametros:
//   luz_fuera: luz entrando pela fresta embaixo (bom quando chega "alguem"); abre: 0..1 quanto as portas abrem;
//   sombra: 0..1 um vulto no vao de luz da fresta; zoom/fy/niebla: iguais as outras pecas.
// Eventos reaproveitados: 'golpe' (as portas tremem), 'mano' (dedos entram pela fresta), 'susto' (olhos).
COMP.elevator = (t, lt, p) => {
  const cx = W / 2, cy = H * 0.5;

  x.fillStyle = '#0a0b0d'; x.fillRect(0, 0, W, H);

  for (let xx = 150; xx < W - 120; xx += 70) { x.beginPath(); x.moveTo(xx, 70); x.lineTo(xx, H - 70); x.stroke(); }

    const edge = cx + s * halfGap;
    const dg = x.createLinearGradient(edge, 0, edge - s * dw / 2, 0);
    dg.addColorStop(0, '#2a2e34'); dg.addColorStop(0.5, '#1a1d22'); dg.addColorStop(1, '#0f1115');
    x.fillStyle = dg; x.fillRect(Math.min(edge, edge - s * dw / 2) + (s < 0 ? 0 : 0), 110, dw / 2, dh);
    x.save(); x.translate(s * shake, 0); x.fillStyle = dg;
    if (s < 0) x.fillRect(cx - dw / 2, 110, dw / 2 - halfGap, dh); else x.fillRect(cx + halfGap, 110, dw / 2 - halfGap, dh);
    x.restore();
  }
  // fresta de luz no chao embaixo das portas
  if (p.luz_fuera !== false) {
    const fy = 110 + dh, g2 = x.createLinearGradient(0, fy - 40, 0, fy + 6);
    g2.addColorStop(0, 'rgba(220,200,150,0)'); g2.addColorStop(1, `rgba(230,210,160,${p.luz_fuera ?? 0.6})`);
    x.fillStyle = g2; x.fillRect(cx - dw / 2, fy - 40, dw, 46);
    // sombra de pes no vao de luz: "alguem parado do lado de fora"
    const sv = rng(p.sombra ?? 0, lt);
    if (sv > 0.01) { x.fillStyle = `rgba(0,0,0,${0.85 * sv})`; for (const fx of [cx - 70, cx + 40]) { x.beginPath(); x.ellipse(fx, fy - 6, 55, 16, 0, 0, 7); x.fill(); } }
  }
  // dedos entrando pela fenda central quando as portas comecam a abrir (evento 'mano')
  const m = E.since(t, 'mano');
  if (m >= 0 && halfGap > 20) {
    const k = ease(m / 0.6);
    for (let f = 0; f < 4; f++) { const fy2 = cy - 150 + f * 70, len = 30 + k * 60; x.fillStyle = 'rgba(205,200,188,0.95)'; x.beginPath(); x.roundRect(cx - halfGap - len, fy2, len, 26, 13); x.fill(); x.fillStyle = 'rgba(60,52,44,0.9)'; x.beginPath(); x.ellipse(cx - halfGap - len + 6, fy2 + 13, 10, 9, 0, 0, 7); x.fill(); }
  }
};

// Olho do velho (O Coracao Delator): olho enorme, iris azul palida com pelicula, veias, rugas.
// p.abre 0..1 (0 = fechado, so a fenda); evento 'abre' abre de vez; p.raio 0..1 = faixa de luz da lanterna.
COMP.olho = (t, lt, p) => {
  x.fillStyle = '#050403'; x.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H * 0.42, raio = p.raio ?? 1;
  const rg = x.createLinearGradient(0, cy - 160, 0, cy + 160);
  rg.addColorStop(0, 'rgba(255,210,140,0)'); rg.addColorStop(0.5, `rgba(255,215,150,${0.22 * raio})`); rg.addColorStop(1, 'rgba(255,210,140,0)');
  x.fillStyle = rg; x.fillRect(0, cy - 160, W, 320);
  glow(cx, cy, 560, `rgba(170,120,90,${0.35 * raio})`);
  const ab = clamp(rng(p.abre ?? 1, lt) + (E.since(t, 'abre') >= 0 ? ease(E.since(t, 'abre') / 0.6) : 0));
  const ew = 380, eh = Math.max(3, 170 * ab);
  x.save(); x.beginPath(); x.ellipse(cx, cy, ew, eh, 0, 0, 7); x.clip();
  x.fillStyle = '#d8cfc0'; x.fillRect(cx - ew, cy - 200, ew * 2, 400);
  x.strokeStyle = 'rgba(150,30,30,0.5)'; x.lineWidth = 3;
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; x.beginPath(); x.moveTo(cx + Math.cos(a) * ew, cy + Math.sin(a) * 170); x.quadraticCurveTo(cx + Math.cos(a + 0.3) * ew * 0.6, cy + Math.sin(a + 0.3) * 100, cx + Math.cos(a) * 150, cy + Math.sin(a) * 80); x.stroke(); }
  const ix = cx + Math.sin(t * 0.7) * 12;
  const ig = x.createRadialGradient(ix, cy, 10, ix, cy, 140);
  ig.addColorStop(0, '#2a3438'); ig.addColorStop(0.35, '#8fb3c4'); ig.addColorStop(0.9, '#5d7c8a'); ig.addColorStop(1, '#2b3a40');
  x.fillStyle = ig; x.beginPath(); x.arc(ix, cy, 140, 0, 7); x.fill();
  x.fillStyle = 'rgba(225,235,240,0.35)'; x.beginPath(); x.arc(ix - 20, cy - 15, 110, 0, 7); x.fill();
  x.fillStyle = 'rgba(10,10,12,0.85)'; x.beginPath(); x.arc(ix, cy, 38 + 12 * E.pulse(t, 'susto', 0.6), 0, 7); x.fill();
  x.fillStyle = 'rgba(255,250,240,0.8)'; x.beginPath(); x.arc(ix - 45, cy - 45, 14, 0, 7); x.fill();
  const sh = x.createLinearGradient(0, cy - eh, 0, cy + eh);
  sh.addColorStop(0, 'rgba(40,20,10,0.7)'); sh.addColorStop(0.3, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(40,20,10,0.4)');
  x.fillStyle = sh; x.fillRect(cx - ew, cy - eh, ew * 2, eh * 2);
  x.restore();
  x.strokeStyle = 'rgba(60,35,25,0.95)'; x.lineWidth = 10; x.beginPath(); x.ellipse(cx, cy, ew, eh, 0, Math.PI, 2 * Math.PI); x.stroke();
  x.strokeStyle = 'rgba(60,35,25,0.5)'; x.lineWidth = 4;
  for (let i = 1; i <= 3; i++) { x.beginPath(); x.ellipse(cx, cy - eh - 22 * i, ew + 30 * i, 40 + 10 * i, 0, Math.PI * 1.1, Math.PI * 1.9); x.stroke(); }
};

// Quarto do velho em perspectiva: tabuas do chao, janela de lua, cama com o velho, raio da lanterna.
// p.porta 0..1 (fresta de luz na porta da esquerda); p.senta 0..1 (o velho senta na cama); p.vazia (cama vazia);
// p.feixe 0..1 (raio da lanterna ate o rosto); p.tabua (tabuas pulsando vermelho a cada 'golpe' = coracao);
// p.visitas = quantos vultos (policiais) de pe no quarto.
COMP.quarto = (t, lt, p) => {
  x.fillStyle = '#030202'; x.fillRect(0, 0, W, H);
  const vx = W * 0.56, vy = H * 0.38, bw = 620, bh = 560, L = vx - bw / 2, R = vx + bw / 2, T = vy - bh / 2, B = vy + bh / 2;
  const poly = (pts, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) x.lineTo(q[0], q[1]); x.closePath(); x.fill(); };
  poly([[0, 0], [W, 0], [R, T], [L, T]], '#100c0a');
  poly([[0, 0], [L, T], [L, B], [0, H]], '#1c1410');
  poly([[W, 0], [R, T], [R, B], [W, H]], '#18110d');
  x.fillStyle = '#211813'; x.fillRect(L, T, bw, bh);
  poly([[0, H], [L, B], [R, B], [W, H]], '#261a12');
  // luar entrando pela janela e caindo no chao
  glow(vx - 60, B + 160, 520, 'rgba(120,140,185,0.16)');
  x.strokeStyle = 'rgba(0,0,0,0.55)'; x.lineWidth = 3;
  for (let i = 0; i <= 12; i++) { const xb = L + bw * i / 12; x.beginPath(); x.moveTo(xb, B); x.lineTo(vx + (xb - vx) * 3.2, H); x.stroke(); }
  for (let k = 1; k <= 5; k++) { const y = B + (H - B) * Math.pow(k / 5, 1.8); x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }
  const wx = vx - 150, wy = vy - 90;
  glow(wx, wy, 380, 'rgba(110,130,170,0.18)');
  x.fillStyle = 'rgba(70,85,115,0.55)'; x.fillRect(wx - 70, wy - 110, 140, 220);
  x.fillStyle = '#100b09'; x.fillRect(wx - 4, wy - 110, 8, 220); x.fillRect(wx - 70, wy - 4, 140, 8);
  if (p.tabua) {
    const hb = E.pulse(t, 'golpe', 0.3), px = vx - 60, py = B + (H - B) * 0.45;
    glow(px, py, 260 + 120 * hb, `rgba(170,20,15,${0.18 + 0.4 * hb})`);
    x.strokeStyle = `rgba(200,40,30,${0.25 + 0.5 * hb})`; x.lineWidth = 4; x.strokeRect(px - 160, py - 30, 320, 60);
  }
  const bx = vx + 150, by = B - 30;
  x.fillStyle = '#1d1410'; x.fillRect(bx - 40, by - 210, 30, 230);
  poly([[bx - 10, by - 60], [bx + 330, by - 20], [bx + 420, by + 120], [bx - 10, by + 60]], '#2a201a');
  poly([[bx - 10, by - 40], [bx + 300, by - 5], [bx + 400, by + 110], [bx - 10, by + 50]], '#3a2e26');
  const senta = p.vazia ? -1 : rng(p.senta ?? 0, lt), hy = by - 60 - Math.max(0, senta) * 150, hx = bx + 40;
  if (senta >= 0) {
    glow(hx, hy, 200, 'rgba(120,140,185,0.14)');
    x.fillStyle = '#050303'; x.beginPath(); x.ellipse(hx, hy, 45, 55, 0, 0, 7); x.fill();
    if (senta > 0.2) { x.beginPath(); x.moveTo(hx - 60, hy + 50); x.quadraticCurveTo(hx, hy + 20, hx + 70, hy + 60); x.lineTo(hx + 80, by - 20); x.lineTo(hx - 70, by - 20); x.fill(); }
  }
  const fx = rng(p.feixe ?? 0, lt);
  if (fx > 0.01 && senta >= 0) {
    const sy = H * 0.47, w = 6 + 40 * fx, g = x.createLinearGradient(0, sy, hx, hy);
    g.addColorStop(0, `rgba(255,214,150,${0.55 * fx})`); g.addColorStop(1, `rgba(255,230,180,${0.85 * fx})`);
    x.fillStyle = g; x.beginPath(); x.moveTo(0, sy - w * 0.3); x.lineTo(hx, hy - w); x.lineTo(hx, hy + w); x.lineTo(0, sy + w * 0.3); x.fill();
    glow(hx, hy, 160 * fx + 40, `rgba(255,220,160,${0.5 * fx})`);
    x.fillStyle = `rgba(160,200,215,${0.9 * fx})`; x.beginPath(); x.arc(hx - 12, hy - 8, 7, 0, 7); x.fill();
  }
  for (let i = 0; i < (p.visitas || 0); i++) figure(L + 110 + i * 160, B + 60, 0.55, 'rgba(0,0,0,0.92)', { tall: 1.0, arms: 1.0 });
  if (p.porta !== undefined) {
    const po = rng(p.porta, lt);
    x.fillStyle = `rgba(200,150,90,${0.3 * po})`; x.fillRect(150, H * 0.18, 40 * po + 4, H * 0.62);
    x.fillStyle = '#060404'; x.fillRect(0, H * 0.15, 150, H * 0.7);
  }
};

// mulher de costas lavando roupa numa pedra do rio, cabelo longo; ao virar mostra cara de cavalo (Siguanaba)
// p.dist [a,b] distancia (1 longe, 0 perto); p.vira [a,b] quanto ela virou (0 costas, 1 de frente); o evento susto vira de vez
COMP.siguanaba = (t, lt, p) => {
  const sky = x.createLinearGradient(0, 0, 0, H * 0.42); sky.addColorStop(0, '#03050a'); sky.addColorStop(1, '#0e1622'); x.fillStyle = sky; x.fillRect(0, 0, W, H);
  x.fillStyle = '#d5dbe4'; x.beginPath(); x.arc(W * 0.72, H * 0.12, 54, 0, 7); x.fill(); glow(W * 0.72, H * 0.12, 320, 'rgba(200,215,235,0.2)');
  const hz = H * 0.42;
  for (let i = 0; i < 9; i++) { const bx = (i / 8) * W, bh = 120 + rnd(i + 3) * 160; x.fillStyle = '#020305'; x.beginPath(); x.ellipse(bx, hz - 20, 120 + rnd(i) * 60, bh, 0, Math.PI, 0); x.fill(); }
  x.fillStyle = '#04060a'; x.fillRect(0, hz - 24, W, 40);
  const wg = x.createLinearGradient(0, hz, 0, H); wg.addColorStop(0, '#0c1420'); wg.addColorStop(1, '#02040a'); x.fillStyle = wg; x.fillRect(0, hz, W, H - hz);
  for (let i = 0; i < 22; i++) { const yy = hz + 16 + i * i * 2.4, w = 36 + i * 8; x.fillStyle = `rgba(200,215,235,${0.16 - i * 0.005})`; x.fillRect(W * 0.72 - w / 2 + Math.sin(t * 2 + i) * (5 + i), yy, w, 3 + i * 0.2); }
  const dist = rng(p.dist ?? [0.8, 0.6], lt), g = E.since(t, 'susto');
  let vira = rng(p.vira ?? 0, lt); if (g >= 0) vira = Math.max(vira, ease(Math.min(1, g / 0.22)));
  const sc = (0.25 + (1 - dist) * 1.1) * (1 + (g >= 0 ? ease(Math.min(1, g / 0.3)) * 0.12 : 0));
  const fx = W * 0.5, fy = hz + 120 + (1 - dist) * 900;
  x.save(); x.translate(fx, fy); x.scale(sc, sc);
  // pedra e ondas em volta
  x.fillStyle = '#0a0d12'; x.beginPath(); x.ellipse(0, 10, 260, 60, 0, 0, 7); x.fill();
  for (let r = 0; r < 4; r++) { const k = (t * 0.5 + r / 4) % 1; x.strokeStyle = `rgba(200,215,235,${0.25 * (1 - k)})`; x.lineWidth = 4; x.beginPath(); x.ellipse(0, 30, 280 + k * 260, 50 + k * 40, 0, 0, 7); x.stroke(); }
  // guacal dourado ao lado
  x.fillStyle = '#c9a23a'; x.beginPath(); x.ellipse(230, -8, 62, 22, 0, 0, 7); x.fill(); x.fillStyle = '#6d5418'; x.beginPath(); x.ellipse(230, -16, 52, 12, 0, 0, 7); x.fill();
  glow(fx + 230 * sc, fy - 10 * sc, 90, 'rgba(230,190,90,0.18)');
  const fade = 0.75 + 0.15 * Math.sin(t * 1.3), lava = Math.sin(t * 5) * 26;
  // vestido branco ajoelhado
  x.fillStyle = `rgba(226,230,236,${fade})`; x.beginPath(); x.moveTo(-95, -300); x.lineTo(95, -300); x.lineTo(150, -10); x.quadraticCurveTo(0, 20, -150, -10); x.closePath(); x.fill();
  // bracos lavando
  x.strokeStyle = `rgba(214,206,196,${fade})`; x.lineWidth = 26; x.lineCap = 'round';
  x.beginPath(); x.moveTo(-80, -270); x.quadraticCurveTo(-150, -150, -60 + lava, -30); x.stroke();
  x.beginPath(); x.moveTo(80, -270); x.quadraticCurveTo(150, -150, 60 + lava, -30); x.stroke();
  x.fillStyle = `rgba(226,230,236,${fade})`; x.fillRect(-90 + lava, -50, 180, 26);
  // cabeca: de costas so cabelo; virando aparece a cara de cavalo
  const hy = -360, gira = Math.sin(vira * Math.PI / 2);
  x.fillStyle = '#050507';
  x.beginPath(); x.ellipse(0, hy, 62, 74, 0, 0, 7); x.fill();
  x.beginPath(); x.moveTo(-70, hy); x.quadraticCurveTo(-110 - Math.sin(t) * 8, -150, -90, -60); x.lineTo(90, -60); x.quadraticCurveTo(110 + Math.sin(t + 1) * 8, -150, 70, hy); x.closePath(); x.fill();
  if (vira > 0.02) {
    x.save(); x.translate(lerp(40, 0, gira), 0); x.scale(Math.max(0.15, gira), 1);
    x.fillStyle = '#b6bba6'; x.beginPath(); x.moveTo(-58, hy - 70); x.quadraticCurveTo(0, hy - 110, 58, hy - 70); x.lineTo(44, hy + 150); x.quadraticCurveTo(0, hy + 205, -44, hy + 150); x.closePath(); x.fill();
    x.strokeStyle = 'rgba(70,74,60,0.6)'; x.lineWidth = 5; for (const s of [-1, 1]) { x.beginPath(); x.moveTo(s * 30, hy - 20); x.quadraticCurveTo(s * 40, hy + 60, s * 22, hy + 140); x.stroke(); }
    for (const s of [-1, 1]) { x.fillStyle = '#0a0606'; x.beginPath(); x.ellipse(s * 30, hy - 28, 19, 13, s * 0.3, 0, 7); x.fill(); x.fillStyle = '#ff3a2a'; x.beginPath(); x.arc(s * 30, hy - 28, 6, 0, 7); x.fill(); }
    x.fillStyle = '#1c1a14'; for (const s of [-1, 1]) { x.beginPath(); x.ellipse(s * 16, hy + 170, 8, 13, 0, 0, 7); x.fill(); }
    x.fillStyle = '#050507'; x.beginPath(); x.moveTo(-64, hy - 60); x.quadraticCurveTo(0, hy - 130, 64, hy - 60); x.lineTo(70, hy - 20); x.quadraticCurveTo(0, hy - 80, -70, hy - 20); x.closePath(); x.fill();
    x.restore();
    if (vira > 0.6) glow(fx, fy + (hy - 28) * sc, 160 * sc, `rgba(255,60,40,${0.25 * vira})`);
  }
  x.restore();
  for (let i = 0; i < 16; i++) { const rx = (i / 15) * W + rnd(i) * 30, rh = 200 + rnd(i + 5) * 300, sw = Math.sin(t * 1.2 + i) * 16; x.strokeStyle = '#010202'; x.lineWidth = 9; x.beginPath(); x.moveTo(rx, H); x.quadraticCurveTo(rx + sw / 2, H - rh / 2, rx + sw, H - rh); x.stroke(); }
  fog(t, 0.07, '140,150,170');
};

// vagao de metro parado no tunel, visto do corredor; no fundo a porta de vidro para o vagao da frente
// p.luz [a,b] luz do vagao (0 escuro, 1 aceso); p.parpadeo pisca; p.frente [a,b] luz do vagao da frente;
// p.gente quantas pessoas aparecem no vagao da frente (0 = vazio); p.cara rosto colado no vidro (ou evento aparece);
// p.tunel velocidade das luzes do tunel nas janelas (0 = parado); evento mano = marca de mao no vidro
COMP.metro = (t, lt, p) => {
  let L = rng(p.luz ?? 1, lt);
  if (p.parpadeo) L *= rnd(Math.floor(t * 9)) > 0.3 ? 1 : 0.12;
  const ap = E.since(t, 'apaga'); if (ap >= 0 && ap < 0.6) L *= 0.05;
  const F = rng(p.frente ?? 0.8, lt), vx = W / 2, vy = H * 0.44, fw = W * 0.34, fh = H * 0.36;
  const fx0 = vx - fw / 2, fx1 = vx + fw / 2, fy0 = vy - fh / 2, fy1 = vy + fh / 2;
  const P = (a, b, d) => [lerp(a[0], b[0], d), lerp(a[1], b[1], d)];
  const quad = (pts, cor) => { x.fillStyle = cor; x.beginPath(); x.moveTo(...pts[0]); for (const q of pts.slice(1)) x.lineTo(...q); x.closePath(); x.fill(); };
  const c = (r, g, b, k = 1) => `rgb(${Math.round(r * (0.12 + 0.88 * L) * k)},${Math.round(g * (0.12 + 0.88 * L) * k)},${Math.round(b * (0.12 + 0.88 * L) * k)})`;
  x.fillStyle = '#050608'; x.fillRect(0, 0, W, H);
  const TL = [0, 0], TR = [W, 0], BL = [0, H], BR = [W, H], fTL = [fx0, fy0], fTR = [fx1, fy0], fBL = [fx0, fy1], fBR = [fx1, fy1];
  quad([TL, TR, fTR, fTL], c(70, 74, 80)); quad([BL, BR, fBR, fBL], c(46, 44, 42));
  quad([TL, fTL, fBL, BL], c(96, 100, 104)); quad([TR, fTR, fBR, BR], c(90, 94, 98));
  // janelas laterais (tunel escuro, luzes passando quando anda)
  const vel = rng(p.tunel ?? 0, lt);
  for (const lado of [0, 1]) for (let i = 0; i < 3; i++) {
    const d0 = 0.08 + i * 0.27, d1 = d0 + 0.17, nT = lado ? TR : TL, nB = lado ? BR : BL, fT = lado ? fTR : fTL, fB = lado ? fBR : fBL;
    const a = P(P(nT, nB, 0.2), P(fT, fB, 0.2), d0), b = P(P(nT, nB, 0.2), P(fT, fB, 0.2), d1), cc = P(P(nT, nB, 0.48), P(fT, fB, 0.48), d1), d = P(P(nT, nB, 0.48), P(fT, fB, 0.48), d0);
    quad([a, b, cc, d], '#020304');
    if (vel > 0.01) { const u = (t * vel * 1.5 + i * 0.37 + lado * 0.5) % 1; const e = P(a, b, u), f = P(d, cc, u); x.strokeStyle = 'rgba(255,214,140,0.7)'; x.lineWidth = 10; x.beginPath(); x.moveTo(...e); x.lineTo(...f); x.stroke(); }
  }
  // bancos
  for (const lado of [0, 1]) {
    const nT = lado ? TR : TL, nB = lado ? BR : BL, fT = lado ? fTR : fTL, fB = lado ? fBR : fBL;
    const a = P(nT, nB, 0.66), b = P(fT, fB, 0.66), cc = P(fT, fB, 0.82), d = P(nT, nB, 0.82);
    const dx = lado ? -1 : 1;
    quad([a, b, [b[0] + dx * 22, b[1]], [a[0] + dx * 190, a[1]]], c(40, 70, 120));
    quad([[a[0] + dx * 190, a[1]], [b[0] + dx * 22, b[1]], cc, d], c(28, 48, 86));
  }
  // barras de segurar
  x.lineCap = 'round';
  for (const d of [0.25, 0.55]) for (const s of [-1, 1]) {
    const top = P([vx + s * W * 0.32, 0], [vx + s * fw * 0.32, fy0], d), bot = P([vx + s * W * 0.32, H], [vx + s * fw * 0.32, fy1], d);
    x.strokeStyle = c(190, 196, 200); x.lineWidth = lerp(26, 8, d); x.beginPath(); x.moveTo(...top); x.lineTo(...bot); x.stroke();
  }
  // luzes do teto
  for (const s of [-1, 1]) { x.strokeStyle = `rgba(235,240,255,${0.15 + 0.85 * L})`; x.lineWidth = 16; x.beginPath(); x.moveTo(vx + s * W * 0.25, 30); x.lineTo(vx + s * fw * 0.25, fy0 + 6); x.stroke(); }
  if (L > 0.5) glow(vx, H * 0.08, W * 0.7, `rgba(220,230,255,${0.12 * L})`);
  // parede do fundo e porta de vidro
  quad([fTL, fTR, fBR, fBL], c(80, 84, 90));
  const dw = fw * 0.42, dx0 = vx - dw / 2, dy0 = fy0 + fh * 0.12, dh = fh * 0.82;
  x.fillStyle = c(150, 156, 162); x.fillRect(dx0, dy0, dw, dh);
  const gx = dx0 + dw * 0.12, gy = dy0 + dh * 0.1, gw = dw * 0.76, gh = dh * 0.5;
  const fg = x.createLinearGradient(0, gy, 0, gy + gh); fg.addColorStop(0, `rgba(${200 * F + 8},${210 * F + 8},${220 * F + 10},1)`); fg.addColorStop(1, `rgba(${120 * F + 4},${126 * F + 4},${134 * F + 6},1)`);
  x.fillStyle = fg; x.fillRect(gx, gy, gw, gh);

// ---------------- legenda e quadro ----------------
function subtitle(t) {
  if (window.__semLegenda) return;
  const s = ST.segs.find(s => t >= s.t0 - 0.05 && t <= s.t1 + 0.25);
  if (!s) return;
  const words = s.text.split(' ').filter(Boolean), chunks = [], ini = [];
  for (let i = 0; i < words.length;) { let n = 0, len = 0; while (i + n < words.length && (n < 2 || len < 16) && n < 5) { len += words[i + n].length + 1; n++; if (/[.?!…:]$/.test(words[i + n - 1])) break; } chunks.push(words.slice(i, i + n).join(' ')); ini.push(i); i += n; }
  let cur = chunks[chunks.length - 1];
  if (s.w && s.w.length === words.length) {
    // tempo de cada palavra medido na voz (tts.py): o bloco aparece 0,1 s antes da primeira palavra dele
    let k = 0; for (let i = 0; i < words.length; i++) if (s.w[i] <= t + 0.1) k = i;
    for (let c = 0; c < chunks.length; c++) if (ini[c] <= k) cur = chunks[c];
  } else {
    const total = chunks.reduce((a, b) => a + b.length, 0), pp = (t - s.t0) / (s.t1 - s.t0) * total;
    let acc = 0;
    for (const ch of chunks) { acc += ch.length; if (pp <= acc) { cur = ch; break; } }
  }
  x.font = '900 76px "Arial Black", Impact, system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  const lines = []; let line = '';
  for (const w of cur.split(' ')) { const test = line ? line + ' ' + w : w; if (x.measureText(test).width > W - 300 && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line);
  lines.forEach((l, i) => {
    // zona segura do Shorts: o rodape (nome do canal, Inscrever-se, descricao) cobre de ~72% para baixo
    // e a coluna de botoes ocupa a direita, entao a legenda fica em 62% e puxada para a esquerda
    const y = H * 0.62 + i * 90, cx = W / 2 - 50;
    x.lineWidth = 14; x.strokeStyle = '#000'; x.lineJoin = 'round'; x.strokeText(l.toUpperCase(), cx, y);
    x.fillStyle = RX && RX.test(l) ? (CALMO() ? '#ffcf6b' : '#ff3a2a') : '#f4efe6'; x.fillText(l.toUpperCase(), cx, y);
  });
}
