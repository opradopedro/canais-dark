<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Motor ilustrado (Old Tales / Hora Muerta / Signal Lost).
   Fundo = ilustracao da Release "fundos" (gerada uma vez por LUGAR); boneco, camera, efeitos, cartoes e legenda =
   codigo. Tudo e funcao do tempo: render(t) desenha o quadro t (s) sem estado, entao as fatias do Actions batem.
   Dados: window.carregar(estado) com {dur, fundos:{id:url}, elenco:{}, cenas:[], segs:[], paleta}.
   REGRA do Pedro: tudo que e do rosto/cabeca e desenhado no sistema da cabeca (nunca coordenada fixa). */
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1920, H = 1080;
let E = null; const IMG = {}; let faltam = 0;
window.pronto = () => E && faltam === 0;
window.carregar = (estado) => {
  E = estado;
  for (const [id, url] of Object.entries(estado.fundos || {})) {
    faltam++; const im = new Image();
    im.onload = () => faltam--; im.onerror = () => { faltam--; console.log('FUNDO FALTANDO ' + id); };
    im.src = url; IMG[id] = im;
  }
  E.chunks = montarLegenda(E);
};

// ---------------------------------------------------------------- util
const cl = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = cl(k, 0, 1); return k * k * (3 - 2 * k); };
const easeOut = k => 1 - Math.pow(1 - cl(k, 0, 1), 3);
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const D2R = Math.PI / 180;
const par = (v, k) => Array.isArray(v) ? lerp(v[0], v[v.length - 1], k) : v;

// ---------------------------------------------------------------- camera / fundo
// cam: {z:[de,para], x:[de,para], y:[de,para]} centro em fracao da imagem. Atores usam coordenadas da imagem
// (u,v em 0..1), entao o zoom da camera aproxima fundo e boneco juntos.
function camera(cena, k) {
  const c = cena.cam || {};
  const z = par(c.z ?? [1.08, 1.2], ease(k)), x = par(c.x ?? 0.5, ease(k)), y = par(c.y ?? 0.55, ease(k));
  return { z, x, y };
}
function vistaFundo(img, cam) {
  const iw = img ? img.width : 1920, ih = img ? img.height : 1080;
  const s = Math.max(W / iw, H / ih) * cam.z, w = iw * s, h = ih * s;
  let x = W / 2 - cam.x * w, y = H / 2 - cam.y * h;
  x = cl(x, W - w, 0); y = cl(y, H - h, 0);
  return { x, y, w, h, s: w / 1920 };
}
const tela = (v, u, vv) => [v.x + u * v.w, v.y + vv * v.h];

// ---------------------------------------------------------------- poses (angulos em graus; 0 = para baixo, + = para a frente)
// p: {lean, y, aL:[ombro,cotovelo], aR, lL:[quadril,joelho], lR, cab}
const P = {
  parado: t => ({ lean: 2, y: Math.sin(t * 2.2) * 2, aL: [8, -10], aR: [-6, -12], lL: [4, 0], lR: [-4, 0], cab: Math.sin(t * 1.3) * 2 }),
  andar: t => { const s = Math.sin(t * 8); return { lean: 5, y: Math.abs(Math.cos(t * 8)) * -6, aL: [-s * 28, -18], aR: [s * 28, -18], lL: [s * 26, s > 0 ? 0 : 30], lR: [-s * 26, s < 0 ? 0 : 30], cab: 0 }; },
  correr: t => { const s = Math.sin(t * 13); return { lean: 18, y: Math.abs(Math.cos(t * 13)) * -14, aL: [-s * 55, -80], aR: [s * 55, -80], lL: [s * 45, s > 0 ? 10 : 80], lR: [-s * 45, s < 0 ? 10 : 80], cab: -6 }; },
  pular: t => ({ lean: 25, y: 0, aL: [150, -20], aR: [130, -30], lL: [60, 90], lR: [20, 110], cab: -10 }),
  agachar: t => ({ lean: 30, y: 70, aL: [40, -60], aR: [30, -70], lL: [80, 150], lR: [60, 140], cab: -5 }),
  lutar: t => { const s = Math.sin(t * 5); return { lean: 10, y: 8 + s * 3, aL: [60, -90], aR: [40 + s * 10, -100], lL: [25, 25], lR: [-25, 20], cab: -4 }; },
  golpe: t => { const k = (t * 2.2) % 1; const sw = k < 0.35 ? lerp(160, -30, easeOut(k / 0.35)) : -30; return { lean: 20, y: 10, aL: [sw, -20], aR: [sw - 10, -25], lL: [35, 20], lR: [-30, 10], cab: -5 }; },
  apontar: t => ({ lean: 3, y: Math.sin(t * 2) * 2, aL: [10, -10], aR: [90, 0], lL: [5, 0], lR: [-5, 0], cab: 4 }),
  triunfo: t => ({ lean: -4, y: Math.sin(t * 6) * 4, aL: [165, -10], aR: [170, -15], lL: [10, 0], lR: [-10, 0], cab: -8 }),
  chorar: t => ({ lean: 14, y: 6 + Math.sin(t * 9) * 2, aL: [120, -150], aR: [115, -145], lL: [6, 4], lR: [-6, 4], cab: 14 }),
  sentar: t => ({ lean: -2, y: 95, aL: [30, -50], aR: [20, -60], lL: [90, -90], lR: [85, -95], cab: Math.sin(t * 1.5) * 3 }),
  cair: t => ({ lean: 80, y: 120, aL: [100, 0], aR: [80, -10], lL: [40, 10], lR: [70, 20], cab: 10 }),
  deitado: t => ({ lean: 90, y: 150, aL: [100, 0], aR: [80, 0], lL: [-88, 0], lR: [-92, 0], cab: 0 }),
  curvar: t => ({ lean: 50, y: 25, aL: [70, -20], aR: [60, -30], lL: [15, 30], lR: [-10, 25], cab: 10 }),
  susto: t => ({ lean: -12, y: Math.sin(t * 30) * 2, aL: [100, -110], aR: [95, -100], lL: [-10, 0], lR: [-25, 5], cab: -10 }),
  escalar: t => { const s = Math.sin(t * 6); return { lean: -6, y: s * 6, aL: [170 + s * 10, -10], aR: [150 - s * 10, -30], lL: [60 + s * 30, 80], lR: [40 - s * 30, 90], cab: -15 }; },
};

// ---------------------------------------------------------------- rostos
function rosto(r, t, cor) {
  const pis = (t % 3.3) < 0.1 ? 0.12 : 1;
  X.save(); X.fillStyle = '#111'; X.strokeStyle = '#111'; X.lineCap = 'round';
  const olho = (x, s) => { X.beginPath(); X.ellipse(x, 2, 6.5 * s, 10 * s * pis, 0, 0, 7); X.fill(); };
  const sob = (x1, y1, x2, y2) => { X.lineWidth = 6; X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); };
  const boca = f => { X.lineWidth = 5; X.beginPath(); f(); X.stroke(); };
  switch (r) {
    case 'raiva': case 'determinado':
      olho(-18, 1); olho(18, 1); sob(-34, -24, -8, -12); sob(34, -24, 8, -12);
      boca(() => r === 'raiva' ? (X.moveTo(-14, 32), X.quadraticCurveTo(0, 24, 14, 32)) : (X.moveTo(-12, 30), X.lineTo(12, 30)));
      if (r === 'raiva') { X.fillStyle = '#fff'; X.fillRect(-10, 27, 20, 5); } break;
    case 'medo': case 'choque':
      olho(-18, 1.4); olho(18, 1.4); sob(-32, -28, -10, -34); sob(32, -28, 10, -34);
      X.lineWidth = 5; X.beginPath(); X.ellipse(0, 32, 9, r === 'choque' ? 15 : 11, 0, 0, 7); X.stroke(); break;
    case 'dor':
      sob(-30, -2, -8, 6); sob(-30, 10, -8, 6); sob(30, -2, 8, 6); sob(30, 10, 8, 6);
      boca(() => { X.moveTo(-14, 34); X.lineTo(-6, 28); X.lineTo(2, 34); X.lineTo(10, 28); X.lineTo(16, 34); }); break;
    case 'triste': case 'choro':
      olho(-18, 0.9); olho(18, 0.9); sob(-32, -14, -8, -24); sob(32, -14, 8, -24);
      boca(() => { X.moveTo(-12, 36); X.quadraticCurveTo(0, 26, 12, 36); });
      if (r === 'choro') { X.strokeStyle = '#5aa8e8'; X.lineWidth = 4; for (const s of [-1, 1]) { const k = (t * 1.6 + (s > 0 ? 0.5 : 0)) % 1; X.beginPath(); X.moveTo(s * 18, 14); X.lineTo(s * 20, 14 + k * 40); X.stroke(); } } break;
    case 'sorriso': case 'riso':
      olho(-18, 1); olho(18, 1); sob(-30, -20, -8, -22); sob(30, -20, 8, -22);
      boca(() => { X.moveTo(-16, 26); X.quadraticCurveTo(0, r === 'riso' ? 46 : 38, 16, 26); }); break;
    default: // calmo
      olho(-18, 1); olho(18, 1); sob(-30, -18, -8, -20); sob(30, -18, 8, -20);
      boca(() => { X.moveTo(-10, 30); X.quadraticCurveTo(0, 34, 10, 30); });
  }
  X.restore();
}

// ---------------------------------------------------------------- boneco
// el (elenco): {tipo:'macaco'|'humano', pelo, rosto_cor, tiara, armadura, faixa, arma:'bastao'|'lanca'|'espada', cabelo:'curtinho'|'normal'|'longo'|'cacheado'|'careca'|'lados'|'coque', barba_estilo:'curta'|'cheia'|'cavanhaque'|'chinesa', barba (cor),
// roupa:'tanga'|'tunica'|'trapos'|'cota'|'jaqueta', roupa_cor, elmo, elmo_med, manto, barba, olhos_ouro, desgaste 0..1}
// REGRA do Pedro (13/11): NAO existe boneco fixo por canal. Cada conto tem o seu protagonista, vestido de acordo com a
// historia (Idade da Pedra = tanga; medieval = tunica/cota; zumbi = desgaste sobe por parte: cabelo e barba crescem, sujeira).
// "desgaste" pode ir no elenco (vale o video todo) ou no ator da cena (muda ao longo do video).
const L = { tronco: 125, braco: 68, ante: 62, coxa: 84, canela: 84, cab: 56 };
function membro(x, y, a1, a2, l1, l2, vira) {
  const r1 = a1 * D2R * vira, x1 = x + Math.sin(r1) * l1, y1 = y + Math.cos(r1) * l1;
  const r2 = (a1 + a2) * D2R * vira, x2 = x1 + Math.sin(r2) * l2, y2 = y1 + Math.cos(r2) * l2;
  return [x1, y1, x2, y2, r2];
}

// ---------------------------------------------------------------- cabelos e barbas (sistema da cabeca, raio R)
// cabelo: curtinho | normal | longo | cacheado | careca | lados (calvo, so dos lados: mais velhos) | coque
// barba: curta | cheia | cavanhaque | chinesa (bigode fino caido + cavanhaque longo)
// desgaste (zumbi/sobrevivencia): cabelo vira bagunca mais longa e a barba nasce e cresce.
const CONT = '#141414';
function pinta(cor, lw = 4) { X.fillStyle = cor; X.strokeStyle = CONT; X.lineWidth = lw; X.fill(); X.stroke(); }
function estiloCabelo(el, dg) { let c = el.cabelo || 'normal'; if (dg > 0.55 && ['curtinho', 'normal'].includes(c)) c = 'bagunca'; return c; }
function cabeloAtras(el, R, dg) {
  const c = estiloCabelo(el, dg), cor = el.cabelo_cor || '#2a1a10';
  if (c === 'longo' || (c === 'bagunca' && dg > 0.75)) { const l = c === 'longo' ? 78 : 40 + 50 * dg;
    X.beginPath(); X.moveTo(-R - 6, -6); X.quadraticCurveTo(-R - 14, l * 0.6, -R + 4, l); X.lineTo(R - 4, l); X.quadraticCurveTo(R + 14, l * 0.6, R + 6, -6); X.arc(0, -6, R + 6, 0, Math.PI, true); X.closePath(); pinta(cor); }
}
function cabeloFrente(el, R, dg, t) {
  const c = estiloCabelo(el, dg), cor = el.cabelo_cor || '#2a1a10';
  if (c === 'careca') { X.strokeStyle = 'rgba(255,255,255,0.7)'; X.lineWidth = 5; X.beginPath(); X.arc(-14, -26, 14, Math.PI * 1.1, Math.PI * 1.6); X.stroke(); return; }
  if (c === 'curtinho') { X.beginPath(); X.arc(0, 0, R + 3, Math.PI * 1.08, Math.PI * 1.92); X.arc(0, 4, R - 8, Math.PI * 1.85, Math.PI * 1.15, true); X.closePath(); pinta(cor); return; }
  if (c === 'normal') { X.beginPath(); X.moveTo(-R - 3, 0); X.arc(0, 0, R + 4, Math.PI, Math.PI * 2); X.lineTo(R + 3, 2); X.quadraticCurveTo(R - 4, -18, R - 16, -22); X.quadraticCurveTo(10, -10, -14, -26); X.quadraticCurveTo(-R + 6, -20, -R - 3, 0); X.closePath(); pinta(cor); return; }
  if (c === 'longo') { X.beginPath(); X.moveTo(-R - 4, 6); X.arc(0, 0, R + 5, Math.PI, Math.PI * 2); X.lineTo(R + 4, 6); X.quadraticCurveTo(R - 6, -22, 4, -30); X.quadraticCurveTo(-R + 6, -22, -R - 4, 6); X.closePath(); pinta(cor); return; }
  if (c === 'cacheado') { X.fillStyle = cor; X.strokeStyle = CONT; X.lineWidth = 4;
    for (let i = 0; i < 11; i++) { const ang = Math.PI * (0.95 + i * 1.1 / 10); X.beginPath(); X.arc(Math.cos(ang) * (R - 2), Math.sin(ang) * (R - 2) - 6, 17, 0, 7); X.fill(); X.stroke(); }
    X.beginPath(); X.arc(0, -10, R - 6, Math.PI * 1.05, Math.PI * 1.95); X.fill(); return; }
  if (c === 'lados') { for (const s of [-1, 1]) { X.beginPath(); X.moveTo(s * (R - 4), -22); X.quadraticCurveTo(s * (R + 16), -10, s * (R + 8), 20); X.quadraticCurveTo(s * (R - 2), 14, s * (R - 6), 8); X.closePath(); pinta(el.cabelo_cor || '#b8b8b0'); }
    X.strokeStyle = 'rgba(255,255,255,0.6)'; X.lineWidth = 5; X.beginPath(); X.arc(-12, -28, 14, Math.PI * 1.1, Math.PI * 1.6); X.stroke(); return; }
  if (c === 'coque') { X.beginPath(); X.arc(0, 0, R + 3, Math.PI * 1.02, Math.PI * 1.98); X.arc(0, 2, R - 10, Math.PI * 1.9, Math.PI * 1.1, true); X.closePath(); pinta(cor); X.beginPath(); X.arc(0, -R - 14, 17, 0, 7); pinta(cor); return; }
  if (c === 'bagunca') { // cabelo crescendo sem corte
    X.fillStyle = cor; X.strokeStyle = CONT; X.lineWidth = 4; X.beginPath(); X.moveTo(-R - 4, 8);
    const n = 9; for (let i = 0; i <= n; i++) { const ang = Math.PI * (1.0 + i / n), r1 = R + 4, r2 = R + 14 + 26 * dg * (0.6 + rnd(i) * 0.6);
      X.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1); if (i < n) { const am = ang + Math.PI / n / 2; X.lineTo(Math.cos(am) * r2, Math.sin(am) * r2 + 6 * dg); } }
    X.lineTo(R + 4, 4); X.quadraticCurveTo(R - 10, -24, 0, -22); X.quadraticCurveTo(-R + 10, -24, -R - 4, 4); X.closePath(); X.fill(); X.stroke(); }
}
function barba(el, R, dg) {
  let b = el.barba_estilo || (el.barba ? 'cheia' : ''); const cor = el.barba || el.cabelo_cor || '#2a1a10';
  if (!b && dg > 0.15) b = dg < 0.45 ? 'curta' : 'cheia';
  if (!b) return;
  const cresce = 1 + (b === 'cheia' ? dg * 0.9 : 0);
  if (b === 'curta') { X.fillStyle = 'rgba(30,20,10,0.55)'; for (let i = 0; i < 40; i++) { const ang = Math.PI * (0.12 + rnd(i) * 0.76), r = R * (0.55 + rnd(i + 7) * 0.4); X.beginPath(); X.arc(Math.cos(ang) * r, Math.sin(ang) * r + 4, 1.8, 0, 7); X.fill(); } return; }
  if (b === 'cheia') { X.beginPath(); X.moveTo(-R + 3, 14); X.quadraticCurveTo(-R + 4, R * 0.9 * cresce, 0, R + 20 * cresce); X.quadraticCurveTo(R - 4, R * 0.9 * cresce, R - 3, 14); X.quadraticCurveTo(R - 12, 28, 14, 24); X.quadraticCurveTo(0, 40, -14, 24); X.quadraticCurveTo(-R + 12, 28, -R + 3, 14); X.closePath(); pinta(cor);
    X.fillStyle = el.rosto_cor || '#fff'; X.beginPath(); X.ellipse(0, 31, 11, 5, 0, 0, 7); X.fill(); return; }
  if (b === 'cavanhaque') { X.beginPath(); X.moveTo(-16, 24); X.quadraticCurveTo(0, 18, 16, 24); X.lineTo(10, 50); X.quadraticCurveTo(0, 58, -10, 50); X.closePath(); pinta(cor); return; }
  if (b === 'chinesa') { // bigode fino caindo dos lados + cavanhaque longo e pontudo
    X.strokeStyle = CONT; X.lineWidth = 9; X.lineCap = 'round'; for (const s of [-1, 1]) { X.beginPath(); X.moveTo(0, 22); X.quadraticCurveTo(s * 20, 18, s * 26, 34); X.quadraticCurveTo(s * 30, 60, s * 22, 84); X.stroke(); }
    X.strokeStyle = cor; X.lineWidth = 5; for (const s of [-1, 1]) { X.beginPath(); X.moveTo(0, 22); X.quadraticCurveTo(s * 20, 18, s * 26, 34); X.quadraticCurveTo(s * 30, 60, s * 22, 84); X.stroke(); }
    X.beginPath(); X.moveTo(-9, 40); X.quadraticCurveTo(0, 36, 9, 40); X.lineTo(2, 104); X.lineTo(-2, 104); X.closePath(); pinta(cor, 3); }
}
function boneco(a, el, t, sx, sy, esc) {
  const pose = (P[a.pose] || P.parado)(t + (a.fase || 0));
  const vira = a.vira ?? 1, lw = 13;
  X.save(); X.translate(sx, sy); X.scale(esc, esc);
  // sombra no chao
  X.fillStyle = 'rgba(0,0,0,0.28)'; X.beginPath(); X.ellipse(0, 4, 70, 12, 0, 0, 7); X.fill();
  const hipY = -(L.coxa + L.canela) + pose.y, lean = pose.lean * D2R * vira;
  const shX = Math.sin(lean) * L.tronco, shY = hipY - Math.cos(lean) * L.tronco;
  const corMembro = el.membro || (el.tipo === 'macaco' ? (el.pelo || '#8a5a30') : '#ffffff');
  const traco = (pts, w) => { X.beginPath(); X.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) X.lineTo(pts[i], pts[i + 1]); X.strokeStyle = CONT; X.lineWidth = w + 9; X.stroke(); X.strokeStyle = corMembro; X.lineWidth = w; X.stroke(); };
  X.lineCap = 'round'; X.lineJoin = 'round';
  // rabo (macaco) - preso no quadril, balanca
  if (el.tipo === 'macaco') {
    X.strokeStyle = el.pelo || '#8a5a30'; X.lineWidth = 9; X.beginPath(); X.moveTo(0, hipY);
    const bal = Math.sin(t * 3 + (a.fase || 0)) * 25;
    X.bezierCurveTo(-vira * 70, hipY + 10, -vira * 90, hipY - 70 + bal, -vira * 50, hipY - 110 + bal); X.stroke();
  }
  const perna = (ang) => { const m = membro(0, hipY, ang[0], -ang[1], L.coxa, L.canela, vira);
    traco([0, hipY, m[0], m[1], m[2], m[3]], lw);
    X.fillStyle = CONT; X.beginPath(); X.ellipse(m[2] + vira * 8, m[3], 17, 9, 0, 0, 7); X.fill(); };
  const braco = (ang, mao) => { const m = membro(shX, shY + 8, ang[0], ang[1], L.braco, L.ante, vira);
    traco([shX, shY + 8, m[0], m[1], m[2], m[3]], lw);
    if (mao) { X.fillStyle = el.mao || '#fff'; X.strokeStyle = '#141414'; X.lineWidth = 4; X.beginPath(); X.arc(m[2], m[3], 13, 0, 7); X.fill(); X.stroke(); }
    return m; };
  // ordem: membros de tras, corpo, membros da frente
  perna(pose.lR); braco(pose.aL, true);
  // tronco
  traco([0, hipY, shX, shY], lw + 4);
  // roupa ao longo do tronco (segue o corpo)
  X.save(); X.translate(0, hipY); X.rotate(lean);
  if (el.manto) { X.fillStyle = el.manto; X.strokeStyle = '#141414'; X.lineWidth = 4; const bal = Math.sin(t * 2.5) * 5; X.beginPath(); X.moveTo(-20, -L.tronco + 4); X.quadraticCurveTo(0, -L.tronco - 6, 20, -L.tronco + 4); X.quadraticCurveTo(34, -40, 52 + bal, 78); X.quadraticCurveTo(0, 92, -52 + bal, 78); X.quadraticCurveTo(-34, -40, -20, -L.tronco + 4); X.closePath(); X.fill(); X.stroke();
    X.strokeStyle = 'rgba(0,0,0,0.25)'; X.lineWidth = 3; X.beginPath(); X.moveTo(0, -L.tronco + 2); X.lineTo(0, 84); X.stroke(); X.fillStyle = '#7a1a12'; X.fillRect(-26, -40, 52, 12); }
  if (el.armadura) { X.fillStyle = el.armadura; X.strokeStyle = '#5a3a08'; X.lineWidth = 4;
    X.beginPath(); X.moveTo(-28, -L.tronco + 8); X.quadraticCurveTo(0, -L.tronco - 4, 28, -L.tronco + 8); X.lineTo(22, -28); X.quadraticCurveTo(0, -18, -22, -28); X.closePath(); X.fill(); X.stroke();
    X.beginPath(); for (let i = 1; i < 4; i++) { X.moveTo(-22, -L.tronco + 8 + i * 22); X.quadraticCurveTo(0, -L.tronco + 16 + i * 22, 22, -L.tronco + 8 + i * 22); } X.stroke(); }
  const ro = el.roupa;
  if (ro === 'tanga') { // idade da pedra: tanga de pele + alca no peito
    X.fillStyle = el.roupa_cor || '#a0703a'; X.strokeStyle = '#3a2410'; X.lineWidth = 4;
    X.beginPath(); X.moveTo(-30, -14); X.lineTo(30, -14); X.lineTo(24, 26); X.lineTo(8, 16); X.lineTo(0, 30); X.lineTo(-10, 16); X.lineTo(-26, 26); X.closePath(); X.fill(); X.stroke();
    X.beginPath(); X.moveTo(-22, -L.tronco + 10); X.lineTo(26, -20); X.lineTo(16, -14); X.lineTo(-28, -L.tronco + 22); X.closePath(); X.fill(); X.stroke();
    X.fillStyle = 'rgba(60,35,10,0.5)'; for (let i = 0; i < 5; i++) { X.beginPath(); X.arc(-18 + i * 9, -2 + (i % 2) * 8, 3, 0, 7); X.fill(); } }

    X.fillStyle = el.roupa_cor || '#6a5a3a'; X.strokeStyle = '#2a2010'; X.lineWidth = 4;
